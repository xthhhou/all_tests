<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梅花易数 · 这段关系的未来</title>
<style>
  /* ===== 全局重置 ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f6f1;
    --bg-card: #ffffff;
    --text-primary: #2c2015;
    --text-secondary: #7a6a58;
    --text-muted: #b0a090;
    --accent: #8b6c42;
    --accent-light: #c9a97a;
    --gold: #c9a97a;
    --border: #e8dfd0;
    --radius: 12px;
    --shadow: 0 2px 20px rgba(44,32,21,0.07);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "PingFang SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 布局容器 ===== */
  .page { display: none; min-height: 100vh; padding: 48px 24px 80px; }
  .page.active { display: flex; flex-direction: column; align-items: center; }
  .inner { width: 100%; max-width: 560px; }

  /* ===== 顶部装饰 ===== */
  .deco-line {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 36px;
    color: var(--text-muted);
    font-size: 11px; letter-spacing: 3px;
  }
  .deco-line::before, .deco-line::after {
    content: ""; flex: 1;
    height: 1px; background: var(--border);
  }

  /* ===== 标题区 ===== */
  .page-title {
    text-align: center;
    margin-bottom: 40px;
  }
  .page-title .tag {
    font-size: 11px; letter-spacing: 4px;
    color: var(--accent-light);
    margin-bottom: 12px;
  }
  .page-title h1 {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 400;
    color: var(--text-primary);
    letter-spacing: 2px;
    line-height: 1.5;
  }
  .page-title .subtitle {
    margin-top: 14px;
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 1px;
  }

  /* ===== 引导卡 ===== */
  .guide-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
  }
  .guide-card p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 2;
  }
  .guide-card .highlight {
    color: var(--accent);
    font-size: 13px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    letter-spacing: 0.5px;
  }

  /* ===== 输入区 ===== */
  .input-section { margin-bottom: 32px; }
  .input-section label {
    display: block;
    font-size: 12px; letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 16px;
    text-align: center;
  }
  .input-row {
    display: flex; gap: 16px; justify-content: center;
  }
  .input-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    flex: 1; max-width: 140px;
  }
  .input-wrap span {
    font-size: 11px; color: var(--text-muted); letter-spacing: 2px;
  }
  .num-input {
    width: 100%; height: 56px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text-primary);
    font-size: 20px;
    font-family: inherit;
    text-align: center;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 2px;
  }
  .num-input:focus {
    border-color: var(--accent-light);
    box-shadow: 0 0 0 3px rgba(201,169,122,0.15);
  }
  .num-input.error { border-color: #c0392b; }
  .error-msg {
    font-size: 11px; color: #c0392b;
    min-height: 16px; letter-spacing: 0.5px;
  }

  /* ===== 按钮 ===== */
  .btn-primary {
    display: block; width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-primary:hover { background: #7a5c35; }
  .btn-primary:active { transform: scale(0.98); }

  .btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 1px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    margin-top: 32px;
  }
  .btn-back:hover { border-color: var(--accent-light); color: var(--accent); }

  /* ===== 结果页：卦象 ===== */
  .hexagram-hero {
    text-align: center;
    padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .hexagram-symbol {
    font-size: 80px;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 16px;
    display: block;
  }
  .hexagram-name {
    font-size: clamp(20px, 4vw, 26px);
    letter-spacing: 4px;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .hexagram-meta {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
  }

  /* ===== 结果页：卦辞 ===== */
  .section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .section-label {
    font-size: 11px; letter-spacing: 3px;
    color: var(--accent-light);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after {
    content: ""; flex: 1;
    height: 1px; background: var(--border);
  }
  .judgment-text {
    font-size: 15px;
    color: var(--text-primary);
    line-height: 2;
    letter-spacing: 1px;
  }
  .judgment-plain {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.9;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }

  /* ===== 结果页：分析 ===== */
  .analysis-text {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 2;
  }
  .analysis-text p { margin-bottom: 12px; }
  .analysis-text p:last-child { margin-bottom: 0; }

  /* ===== 结果页：提醒 ===== */
  .reminder-box {
    background: linear-gradient(135deg, #fdf8f1 0%, #faf4ea 100%);
    border: 1px solid var(--gold);
    border-left: 3px solid var(--gold);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .reminder-box .label {
    font-size: 10px; letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .reminder-box .text {
    font-size: 15px;
    color: var(--accent);
    line-height: 1.8;
    letter-spacing: 0.5px;
  }

  /* ===== 底部联系 ===== */
  .contact-area {
    text-align: center;
    padding-top: 32px;
    border-top: 1px solid var(--border);
    margin-top: 12px;
  }
  .contact-area p {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    margin-bottom: 16px;
  }
  .qr-placeholder {
    width: 100px; height: 100px;
    margin: 0 auto 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-card);
    overflow: hidden;
  }
  .qr-placeholder img { width: 100%; height: 100%; object-fit: cover; }
  .contact-id {
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 2px;
  }

  /* ===== 移动端适配 ===== */
  @media (max-width: 480px) {
    .page { padding: 32px 16px 60px; }
    .guide-card { padding: 20px; }
    .section { padding: 18px 20px; }
    .hexagram-symbol { font-size: 64px; }
    .input-row { gap: 10px; }
    .num-input { height: 50px; font-size: 18px; }
  }
</style>
</head>
<body>

<!-- ===== 起卦页 ===== -->
<div id="page-input" class="page active">
  <div class="inner">

    <div class="deco-line">梅花易数</div>

    <div class="page-title">
      <div class="tag">数字起卦</div>
      <h1>这段关系<br>将会如何发展</h1>
      <p class="subtitle">以卦观势，以象知心</p>
    </div>

    <div class="guide-card">
      <p>
        此刻，请放下心中的预设与期待，静心默念你想了解的那段关系。<br>
        不必刻意思考，让三个 100 到 999 之间的数字自然浮现。
      </p>
      <p class="highlight">· 你与对方之间，未来的走向是什么？</p>
    </div>

    <div class="input-section">
      <label>输入三个随机数字（100 — 999）</label>
      <div class="input-row">
        <div class="input-wrap">
          <span>数字一</span>
          <input class="num-input" id="n1" type="number" min="100" max="999" placeholder="···" inputmode="numeric">
          <span class="error-msg" id="e1"></span>
        </div>
        <div class="input-wrap">
          <span>数字二</span>
          <input class="num-input" id="n2" type="number" min="100" max="999" placeholder="···" inputmode="numeric">
          <span class="error-msg" id="e2"></span>
        </div>
        <div class="input-wrap">
          <span>数字三</span>
          <input class="num-input" id="n3" type="number" min="100" max="999" placeholder="···" inputmode="numeric">
          <span class="error-msg" id="e3"></span>
        </div>
      </div>
    </div>

    <button class="btn-primary" onclick="divine()">开始算卦 · 解卦</button>

  </div>
</div>

<!-- ===== 结果页 ===== -->
<div id="page-result" class="page">
  <div class="inner">

    <div class="deco-line">卦象解读</div>

    <div class="hexagram-hero">
      <span class="hexagram-symbol" id="res-symbol"></span>
      <div class="hexagram-name" id="res-name"></div>
      <div class="hexagram-meta" id="res-meta"></div>
    </div>

    <!-- 卦辞 -->
    <div class="section">
      <div class="section-label">卦辞</div>
      <div class="judgment-text" id="res-judgment"></div>
      <div class="judgment-plain" id="res-plain"></div>
    </div>

    <!-- 关系分析 -->
    <div class="section">
      <div class="section-label">关系走势解读</div>
      <div class="analysis-text" id="res-analysis"></div>
    </div>

    <!-- 提醒 -->
    <div class="reminder-box">
      <div class="label">一句提醒</div>
      <div class="text" id="res-reminder"></div>
    </div>

    <!-- 底部联系 -->
    <div class="contact-area">
      <p>更多私人占卜，欢迎联系</p>

// 通用兜底模板（未填充卦象使用）
function getFallbackAnalysis(hexName) {
  return {

// =====================================================
// 起卦逻辑
// =====================================================
function validate(id, errId) {
  const val = parseInt(document.getElementById(id).value);
  const errEl = document.getElementById(errId);
  if (!val || val < 100 || val > 999) {
    document.getElementById(id).classList.add("error");
    errEl.textContent = "请输入 100–999 的整数";
    return null;
  }
  document.getElementById(id).classList.remove("error");
  errEl.textContent = "";
  return val;
}

function divine() {
  const n1 = validate("n1", "e1");
  const n2 = validate("n2", "e2");
  const n3 = validate("n3", "e3");
  if (n1 === null || n2 === null || n3 === null) return;

  const upperIdx = n1 % 8 || 8;
  const lowerIdx = n2 % 8 || 8;
  const lineIdx  = n3 % 6 || 6;

  const key = upperIdx * 10 + lowerIdx;
  const hex = HEXAGRAMS[key];
  if (!hex) { alert("卦象数据异常，请重新输入"); return; }

  const analysisData = hexagramAnalysis[key] || getFallbackAnalysis(hex.name);

  // 八卦名称
  const bagua = ["", "乾", "兑", "离", "震", "巽", "坎", "艮", "坤"];
  const upperName = bagua[upperIdx];
  const lowerName = bagua[lowerIdx];

  document.getElementById("res-symbol").textContent = hex.symbol;
  document.getElementById("res-name").textContent = hex.name;
  document.getElementById("res-meta").textContent = `上卦 ${upperName}（${upperIdx}）  ·  下卦 ${lowerName}（${lowerIdx}）  ·  动爻第 ${lineIdx} 爻`;
  document.getElementById("res-judgment").textContent = hex.judgment;
  document.getElementById("res-plain").textContent = hex.plain;
  document.getElementById("res-analysis").innerHTML = analysisData.analysis;
  document.getElementById("res-reminder").textContent = analysisData.reminder;

  document.getElementById("page-input").classList.remove("active");
  document.getElementById("page-result").classList.add("active");
  window.scrollTo(0, 0);
}

function goBack() {
  document.getElementById("page-result").classList.remove("active");
  document.getElementById("page-input").classList.add("active");
  window.scrollTo(0, 0);
}

// 回车触发起卦
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("page-input").classList.contains("active")) {
    divine();
  }
});
</script>
