<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>梅花易数 · 数字起卦</title>
<style>
:root{
  --bg: #faf5ee;
  --card: #fffbf5;
  --text: #3d3226;
  --sub: #7a6e5e;
  --accent: #8b5e3c;
  --gold: #c9a96e;
  --gold-light: #e8d5b0;
  --border: #e0d5c5;
  --shadow: 0 2px 16px rgba(60,40,20,.06);
  --radius: 12px;
  --font-heading: "Noto Serif SC","Songti SC","STSong",serif;
  --font-body: "Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.8;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 0 16px;
}
.container{
  max-width: 680px;
  width: 100%;
  padding: 40px 0 60px;
}
/* Header */
.header{
  text-align: center;
  margin-bottom: 36px;
}
.header .motto{
  font-family: var(--font-heading);
  font-size: clamp(16px, 2.4vw, 18px);
  color: var(--accent);
  letter-spacing: .08em;
  line-height: 2;
  padding: 24px 20px;
  border: 1px solid var(--gold-light);
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(201,169,110,.04), rgba(201,169,110,.01));
}
.header .motto span{
  display: block;
  font-size: 13px;
  color: var(--sub);
  letter-spacing: .04em;
  margin-top: 6px;
}
/* Hint */
.hint{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 28px;
  font-size: 13px;
  color: var(--sub);
  line-height: 1.9;
  box-shadow: var(--shadow);
}
.hint::before{content:"";}
/* Form */
.form-section{margin-bottom: 28px}
.form-group{margin-bottom: 20px}
.form-group label{
  display: block;
  font-family: var(--font-heading);
  font-size: 15px;
  color: var(--text);
  margin-bottom: 8px;
  letter-spacing: .04em;
}
.form-group label .optional{
  font-size: 12px;
  color: var(--sub);
  font-family: var(--font-body);
  margin-left: 6px;
}
input[type="text"]{
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border-color .25s, box-shadow .25s;
  box-shadow: var(--shadow);
}
input[type="text"]:focus{
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,169,110,.15);
}
.num-inputs{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.num-inputs input{
  width: 100%;
  padding: 14px 8px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 22px;
  font-family: var(--font-heading);
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border-color .25s, box-shadow .25s;
  box-shadow: var(--shadow);
  letter-spacing: .1em;
}
.num-inputs input:focus{
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,169,110,.15);
}
.num-inputs input::placeholder{
  font-size: 14px;
  color: #c5b9a5;
  font-family: var(--font-body);
  letter-spacing: 0;
}
.btn{
  display: block;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-family: var(--font-heading);
  letter-spacing: .08em;
  cursor: pointer;
  transition: all .3s;
  text-align: center;
}
.btn-primary{
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 14px rgba(139,94,60,.25);
  margin-top: 8px;
}
.btn-primary:hover{
  background: #7a4f2e;
  box-shadow: 0 6px 20px rgba(139,94,60,.35);
  transform: translateY(-1px);
}
.btn-primary:active{transform:translateY(0)}
.btn-copy{
  background: var(--gold);
  color: #fff;
  box-shadow: 0 4px 14px rgba(201,169,110,.25);
  margin-top: 12px;
}
.btn-copy:hover{
  background: #b8955a;
  box-shadow: 0 6px 20px rgba(201,169,110,.35);
}
.btn-copy.copied{background:#5a8a6a}
/* Result */
.result-section{
  display: none;
  animation: fadeIn .5s ease;
}
.result-section.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.hexagram-card{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.hexagram-name{
  font-family: var(--font-heading);
  font-size: clamp(24px, 4vw, 32px);
  color: var(--accent);
  letter-spacing: .1em;
  margin-bottom: 12px;
}
.hexagram-symbol{
  font-size: 48px;
  line-height: 1.4;
  letter-spacing: .2em;
}
.hexagram-meta{
  font-size: 14px;
  color: var(--sub);
  margin-top: 10px;
}
.hexagram-meta .line-badge{
  display: inline-block;
  background: var(--gold-light);
  color: var(--accent);
  padding: 2px 12px;
  border-radius: 20px;
  font-size: 13px;
  margin-left: 8px;
}
.divider{
  border: none;
  border-top: 1px solid var(--border);
  margin: 28px 0;
}
.section-title{
  font-family: var(--font-heading);
  font-size: 17px;
  color: var(--accent);
  margin-bottom: 16px;
  letter-spacing: .06em;
}

.insight-grid{
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 14px;
  margin-bottom: 24px;
}
@media(max-width:640px){
  .insight-grid{grid-template-columns:1fr}
  .num-inputs{gap:8px}
  .num-inputs input{font-size:18px;padding:12px 6px}
}
.insight-card{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 16px;
  box-shadow: var(--shadow);
  transition: transform .25s;
}
.insight-card:hover{transform:translateY(-2px)}
.insight-card .insight-label{
  font-family: var(--font-heading);
  font-size: 14px;
  color: var(--accent);
  margin-bottom: 8px;
  letter-spacing: .06em;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--gold-light);
}
.insight-card .insight-text{
  font-size: 13px;
  color: var(--text);
  line-height: 1.9;
}
.prompt-section{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-top: 24px;
  box-shadow: var(--shadow);
}
.prompt-box{
  background: #fdfaf5;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 18px;
  font-size: 13px;
  line-height: 1.9;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 300px;
  overflow-y: auto;
  font-family: var(--font-body);
}
.prompt-note{
  font-size: 13px;
  color: var(--sub);
  text-align: center;
  margin-top: 12px;
  line-height: 1.8;
}
.error-msg{
  color: #c0392b;
  font-size: 13px;
  text-align: center;
  margin-top: 8px;
  display: none;
}
.error-msg.show{display:block}


/* === Mobile-first improvements === */
/* 页面切换：输入页 / 结果页 */
.view-input { display: block; }
.view-result { display: none; animation: fadeIn .45s ease; }
.view-result.active { display: block; }
.view-input.hidden { display: none; }

/* 返回按钮 */
.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 14px;
  font-family: var(--font-body);
  color: var(--sub);
  cursor: pointer;
  margin-bottom: 20px;
  transition: border-color .2s, color .2s;
}
.btn-back:hover { border-color: var(--accent); color: var(--accent); }

/* 卦辞原文 */
.yuanwen-box {
  background: linear-gradient(135deg, rgba(201,169,110,.07), rgba(201,169,110,.02));
  border: 1px solid var(--gold-light);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 20px;
  font-family: var(--font-heading);
  font-size: 14px;
  line-height: 2;
  color: var(--accent);
}
.yuanwen-box .yw-title {
  font-size: 12px;
  color: var(--sub);
  font-family: var(--font-body);
  letter-spacing: .08em;
  margin-bottom: 6px;
}
.yuanwen-box p { margin: 0; letter-spacing: .04em; }
.yw-baihua {
  margin-top: 10px !important;
  padding-top: 10px;
  border-top: 1px solid var(--gold-light);
  font-family: var(--font-body) !important;
  font-size: 13px !important;
  color: var(--sub) !important;
  line-height: 1.85;
  letter-spacing: .02em !important;
}

/* 解析区域：单一方框 */
.insight-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.insight-row {
  padding: 12px 0;
  border-bottom: 1px solid var(--gold-light);
}
.insight-row:last-child { border-bottom: none; padding-bottom: 0; }
.insight-row:first-child { padding-top: 0; }
.insight-dim {
  font-family: var(--font-heading);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 5px;
  letter-spacing: .04em;
}
.insight-row-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.85;
}

/* 手机端优化 */
@media(max-width: 480px) {
  .container { padding: 24px 0 48px; }
  .header .motto { font-size: 15px; padding: 18px 14px; }
  .hexagram-card { padding: 22px 16px; }
  .prompt-section { padding: 16px; }
  .btn { font-size: 15px; padding: 13px; }
  .num-inputs input { font-size: 20px; padding: 13px 6px; }
}
.bottom-note {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 14px;
  letter-spacing: .04em;
}
.bottom-note {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 14px;
  letter-spacing: .04em;
}
</style>
</head>
<body>
<div class="container">
  <!-- ===== 输入视图 ===== -->
  <div class="view-input" id="viewInput">
  <header class="header">
    <div class="motto">
      不动不占，无事不占<br>
      <span>心诚则灵，感而遂通</span>
    </div>
  </header>

  <div class="hint">
    提示：输入的三个三位数（100-999）必须是完全随机的。请勿使用生日、手机号、车牌等固定数字。建议在心中默念你所求之事，让脑海中自然浮现出三个数字，依序填入。
  </div>

  <div class="form-section">
    <div class="form-group">
      <label>所求何事<span class="optional">（非必填）</span></label>
      <input type="text" id="question" placeholder="如：近期事业发展如何？这段感情走向如何？" maxlength="100">
    </div>
    <div class="form-group">
      <label>请依序填入三个三位数</label>
      <div class="num-inputs">
        <input type="number" id="num1" placeholder="100-999" min="100" max="999">
        <input type="number" id="num2" placeholder="100-999" min="100" max="999">
        <input type="number" id="num3" placeholder="100-999" min="100" max="999">
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn btn-primary" onclick="handleSubmit()">开 始 起 卦</button>
<p class="bottom-note">仅供参考，理性看待 · 小红书 / 微信：Mahoo66</p>
  </div>

  </div><!-- /view-input -->

  <!-- ===== 结果视图 ===== -->
  <div class="view-result" id="viewResult">
    <button class="btn-back" onclick="showInput()">← 重新起卦</button>
    <hr class="divider">
    <div class="hexagram-card" id="hexagramCard"></div>
    <div class="yuanwen-box" id="yuanwenBox" style="display:none">
      <div class="yw-title">卦辞原文</div>
      <div id="yuanwenText"></div>
    </div>
    <div class="insight-block" id="insightGrid"></div>
    <div class="prompt-section">
      <div class="section-title">AI 深层解卦 Prompt</div>
      <div class="prompt-box" id="promptBox"></div>
      <p class="prompt-note">点击下方按钮复制完整 Prompt，前往大语言模型（如 ChatGPT / DeepSeek / Gemini）粘贴即可获得更深度的专属解卦报告。</p>
      <button class="btn btn-copy" id="copyBtn" onclick="copyPrompt()">📋 一键复制 Prompt</button>
<p class="bottom-note">仅供参考，理性看待 · 小红书 / 微信：Mahoo66</p>
    </div>
  </div>

  </div><!-- /view-result -->

</div>

  '1-5':'姤。女壮，勿用取女。\n象曰：天下有风，姤。后以施命诰四方。',
  '1-6':'讼。有孚，窒惕，中吉，终凶。利见大人，不利涉大川。\n象曰：天与水违行，讼。君子以作事谋始。',
  '1-7':'遁。亨。小利贞。\n象曰：天下有山，遁。君子以远小人，不恶而严。',

  '2-2':'兑。亨，利贞。\n象曰：丽泽，兑。君子以朋友讲习。',

  '2-4':'随。元亨利贞，无咎。\n象曰：泽中有雷，随。君子以向晦入宴息。',
  '2-5':'大过。栋桡，利有攸往，亨。\n象曰：泽灭木，大过。君子以独立不惧，遯世无闷。',
  '2-6':'困。亨，贞，大人吉，无咎，有言不信。\n象曰：泽无水，困。君子以致命遂志。',
  '2-7':'咸。亨利贞，取女吉。\n象曰：山上有泽，咸。君子以虚受人。',
  '2-8':'萃。亨。王假有庙，利见大人，亨，利贞。用大牲吉，利有攸往。\n象曰：泽上于地，萃。君子以除戎器，戒不虞。',
  '3-1':'大有。元亨。\n象曰：火在天上，大有。君子以遏恶扬善，顺天休命。',
  '3-2':'睽。小事吉。\n象曰：上火下泽，睽。君子以同而异。',
  '3-3':'离。利贞，亨。畜牝牛，吉。\n象曰：明两作，离。大人以继明照于四方。',
  '3-4':'噬嗑。亨，利用狱。\n象曰：雷电，噬嗑。先王以明罚敕法。',

  '3-6':'未济。亨，小狐汔济，濡其尾，无攸利。\n象曰：火在水上，未济。君子以慎辨物居方。',

  '6-5':'井。改邑不改井，无丧无得，往来井井。汔至，亦未繘井，羸其瓶，凶。\n象曰：木上有水，井。君子以劳民劝相。',

'1-3':{a:'志同道合，光明磊落。人际关系顺畅，易得贵人相助，在集体中发挥自己的光和热。',b:'团队协作顺畅，适合跨部门合作或寻找志趣相投的合作伙伴。公开透明能赢得更多信任。',c:'真诚相待、精神共鸣是当下关键。彼此理解与支持，适合从朋友关系自然发展为伴侣。',d:'合作生财，与他人合伙或团队分红收益佳。分享利益比独占更能打开财路，宜多参与集体投资或集资项目。',e:'家中有喜，亲友往来频繁。适合家庭聚会或乔迁之喜，和睦的家庭氛围是最好的风水。',f:'心情开朗，社交活跃有助于身心健康。但注意人际应酬中的饮食节制，保持适度运动。'},
'1-4':{a:'不妄为，守正道。顺其自然，不可强求。看似偶然的机遇往往藏着必然的因果。',b:'脚踏实地，莫投机取巧。诚信为本，做好分内之事，不合时宜的野心反而带来麻烦。',c:'以真诚换真诚，勿有欺瞒。感情需自然而然发展，刻意追求或手段过多反而适得其反。',d:'不宜投机取巧之财，非分之财不可贪。脚踏实地积累的收入最为安稳，近期忌参与高风险金融产品。',e:'家宅安宁，不宜大兴土木或频繁搬迁。守住现有的居住环境，简单的家居整理便能让气场流通。',f:'心神稍有浮躁，需内观自省。减少无谓的社交消耗，静心读书或练习书法对修养身心大有裨益。'},
'1-5':{a:'邂逅相遇，机缘巧合。偶然的际遇可能带来重要转折，但需保持清醒，辨别良莠。',b:'贵人运强，可能在社交场合遇到对的人或机会。但不宜做重大长期决策，先观察再定夺。',c:'桃花运旺，但多为短暂缘分。享受当下的相遇，不必急于承诺，让时间检验真心。',d:'意外之财或偶然机遇带来收益，但来得快去得也快。见好就收，不宜追加投入，保持现金流充足。',e:'家中或有临时来客，增添热闹氛围。但注意保管好家中的贵重物品，人员流动频繁时更要留心。',f:'心绪飘忽不定，易受外界干扰。建议减少多线程任务，专注于一件事能让身心恢复安宁。'},
'1-6':{a:'争执纠纷，宜和解不宜对抗。退一步海阔天空，诉讼之事能免则免，和为贵。',b:'职场竞争激烈，可能涉及利益纠纷。保持理性、据理力争的同时避免激化矛盾，寻求外部调解。',c:'口舌之争增多，需控制情绪。冷静沟通比争论对错更重要，给彼此台阶下才是智慧。',d:'钱财方面易起纠纷，合同条款需逐字审视。合伙或借贷之事格外谨慎，避免口头约定留下后患。',e:'家宅中可能有口角纷争，需主动调停。保持家中言语温和，不和的气场会影响所有人的运势。',f:'心火上炎，容易焦躁易怒。多喝水、清淡饮食，适当出门散步能让心情平复，避免与人冲突。'},
'1-7':{a:'退避三舍，以退为进。当前宜暂避锋芒，韬光养晦，待时机成熟再图发展。',b:'适时隐退或转换赛道，不适合硬碰硬。利用这段时间学习提升，为下一次出击积蓄力量。',c:'给彼此一些距离和冷静期。疏远不等于结束，适当的空间反而让感情重新找到平衡。',d:'财运收缩期，开源受阻。减少不必要的开支，把资金用于学习和自我投资，比冒险博取回报更明智。',e:'家中适宜安静休整，减少社交应酬。深度打扫居所、清理闲置物品，净化空间也净化心情。',f:'身心进入调整期，给疲惫的自己按下暂停键。保证充足睡眠，适当独处能让精气神重新积蓄。'},
'1-8':{a:'天地闭塞，万物不通。运势低迷期，宜守不宜攻，静待转机而非强行突破。',b:'职场瓶颈明显，上下沟通不畅。此时不是跳槽或创业的好时机，先稳住现有局面为要。',c:'冷战或隔阂加深，需主动打破僵局。坦诚沟通是唯一出路，否则距离只会越来越远。',d:'财运低迷，进账通道阻滞。守住现有资产不动是最佳策略，不宜做任何冒险的投资或借贷。',e:'家宅气场沉闷，需开窗通风、增加绿植。家人之间容易产生隔阂，主动关心问候能化解冰冷气氛。',f:'身心俱疲，感觉诸事不顺。此时不是硬撑的时候，适当休息、降低对自己的要求，先恢复元气。'},
'2-1':{a:'决断之时，当断则断。面对抉择要果敢，犹豫不决反受其乱，但决策需基于正道而非私心。',b:'关键决策节点到来，可能涉及离职、转型或大项目取舍。综合考虑后勇敢踏出一步。',c:'做出明确表态，态度含糊反而伤人。要么全心投入，要么优雅告别，不给彼此留有暧昧空间。',d:'财务抉择的关键时刻，当断则断。对不良资产或拖累性投资果断止损，壮士断腕反而保住根基。',e:'家中可能面临搬迁或重大装修决策。决策前多方听取意见，不急于落定，稳妥考察后再做决定。',f:'身心处于转折点，旧习惯需被打破。下定决心戒烟、戒酒或改变不良作息，现在是行动的最佳时机。'},
'2-2':{a:'喜悦和谐，丽泽相映。运势平顺愉悦，适合社交、学习与分享，以乐观心态面对生活。',b:'沟通表达力强，适合演讲、谈判、教学等需要口才的工作。与同事关系融洽，氛围愉快。',c:'感情甜蜜融洽，双方相互欣赏。适合约会、表白或增进亲密关系，享受当下的美好时光。',d:'财运平顺，适合小额储蓄和稳健理财。享受型消费适度即可，与他人分享财富反而能吸引更多机遇。',e:'家宅祥和欢乐，适合宴请宾朋。家庭氛围轻松愉快，是用心布置家居、增添生活情趣的好时机。',f:'身心愉悦放松，社交活动带来正能量。多与开朗的人相处，笑声是最好的养生长寿之方。'},
'2-3':{a:'变革之时，去旧迎新。顺应变化而非抗拒改变，弃旧图新方能迎来新的生机。',b:'组织变革或职业转型的好时机。拥抱新技术、新方法，甚至考虑转行，勇气会带来回报。',c:'关系面临转折，要么升级要么结束。坦诚面对问题，勇于改变相处模式或做出关键决定。',d:'财富结构正在重组，旧有的收入模式可能被打破。拥抱新业态、学习新理财方式，变革带来新的增长点。',e:'家居环境宜做适当调整或翻新。改变房间布局、更换陈旧的家具，新的气场能带动家运提升。',f:'身体正在排旧纳新，适合开始新的健康计划。改变饮食结构或开始一项新的运动，从内到外焕发新生。'},
'2-4':{a:'随顺自然，从善如流。顺势而为，灵活应变，以开放心态接纳变化与机遇。',b:'跟随行业趋势和大方向走，不必逆势而为。灵活调整策略，顺应市场需求能获得更好结果。',c:'在感情中学会"随"字——不固执己见，多倾听伴侣意见。跟随对方的节奏反而更加和谐。',d:'财运随大流而动，顺势而为收益稳定。跟随市场主流方向投资，不宜逆势操作或独辟蹊径。',e:'家中事务顺其自然，不做大的变动即可。家庭成员间的默契提升，和谐的氛围就是最好的风水。',f:'身心状态随和，保持灵活的生活节奏。不要给自己定太死板的作息计划，顺应身体的自然节律最为健康。'},
'2-5':{a:'大过之时，非常之举。运势波动大，可能面临超出寻常的挑战，需要非凡的勇气应对。',b:'承担重任或接手棘手的项目。压力和机遇并存，顶住压力完成挑战，将获得超常规的回报。',c:'感情中一方付出过多导致失衡。需要找回调剂点，过度牺牲或过度索取都会让关系动摇。',d:'财务压力较大，可能面临超出常规的开销。提前做好资金储备，避免临时拆借，必要时寻求专业理财建议。',e:'家宅中可能有重大家事需要处理，如长辈健康或房产事宜。沉着冷静，家人合力面对，分担压力。',f:'身心承受较大压力，注意心血管和神经系统健康。适当降低工作强度，把健康放在第一位。'},
'2-6':{a:'困顿之中，守正待时。当前运势受阻，如陷泥潭，但困境亦是修行，坚守本心自能脱困。',b:'职业发展遇到瓶颈，项目推进困难。此时需要耐心和韧劲，不放弃的同时调整策略和方法。',c:'感情陷入困境，沟通不畅或外部压力大。信任和耐心是解困的关键，共同面对而非互相指责。',d:'资金周转困难，宜节流不宜开源。缩减非必要支出，将有限的资金用于最重要的方向，熬过困顿期。',e:'家宅气场沉闷压抑，需注入活力。增加家中光源、播放轻松音乐，小的改变能带来大的情绪缓解。',f:'身心疲惫感重，警惕亚健康状态。困顿时期尤其需要规律作息和营养饮食，身体是熬过困境的本钱。'},
'2-7':{a:'感应相通，心意相连。人际关系和合，情感交流顺畅，是建立深度连接的好时机。',b:'合作运极佳，适合寻求合伙或深度业务协作。价值观契合的合作伙伴能带来事半功倍的效果。',c:'两人心意相通，感情升温。适合表白、求婚或修复关系，真诚的交流能化解一切隔阂。',d:'合作生财运，与人联手的项目收益可观。情感连接往往带来商业机会，真诚的关系是最好的财富网络。',e:'家宅温暖有爱，家人之间的情感纽带加深。适合修复家庭关系、表达感恩，爱的流动是最强风水。',f:'身心因爱而滋润，情绪稳定有助于整体健康。与所爱之人共处时光，比任何保健品都更养心。'},
'2-8':{a:'群英荟萃，人才济济。聚集力量才能成大事，找到志同道合的群体，共同进步。',b:'适合组建团队或加入优秀集体。个人的力量有限，在优秀的队伍中学习成长事半功倍。',c:'通过社交圈认识心仪对象，朋友介绍成功率较高。亦适合一起参加集体活动增进感情。',d:'众人拾柴火焰高，集体投资或众筹项目可考虑。在优秀的圈子里分享信息，财路因人群的聚集而拓宽。',e:'家中人气旺盛，适合举办聚会或家庭活动。人气即财气，热闹的家宅氛围能带动整体运势提升。',f:'与志趣相投的人相处身心受益。多参加集体运动或兴趣小组，在团队中获得归属感是极大的心理滋养。'},
'3-1':{a:'丰盛富足，大有收获。运势高光时刻，物质与精神皆有收获，但需居安思危，富而不骄。',b:'收获期到来，之前的努力得到回报。升职加薪或项目成功的机会大，但需保持谦逊与感恩。',c:'感情丰盈，两情相悦。彼此慷慨付出，关系温暖而充实。但也要注意不让物质替代真情。',d:'财运丰盛，收获期到来。投资收益可观，薪资奖金看涨。但富不骄奢，适当回馈和储蓄能为未来打下更坚实基础。',e:'家宅兴旺，喜事临门。适合买房置业或家居升级，良好的居住环境匹配当下的好运程。',f:'身体状态良好，精力旺盛。保持现有的健康习惯，不要因忙碌而透支，定期体检防患于未然。'},
'3-2':{a:'乖离不合，小事可成。与人意见相左，大事难成，但求同存异可办好小事。',b:'团队分歧明显，拉帮结派现象。不宜推动大项目，先把眼前小事做好，逐步弥合分歧。',c:'两人世界观有差异，小摩擦频发。不妨欣赏彼此的独特，不必强求事事同步，求同存异。',d:'财运分化，大的进项受阻但小的零散收入不断。不宜做大额投资决策，细水长流的小利也值得珍惜。',e:'家庭成员间可能产生分歧，小事宜包容。居住环境需保持整洁有序，杂乱的空间会加重矛盾心态。',f:'心绪不宁，容易多想。学会接受"和而不同"，不必事事求完美。分散注意力到兴趣爱好上可缓解焦虑。'},
'3-3':{a:'光明依附，柔丽中正。运势明亮，但需有所依托，借势而为而非单打独斗。',b:'找到好平台或好领导至关重要。依附于优秀的组织和导师，发挥自身才干，前途光明。',c:'感情炽热而美好，但需注意依赖性。保持独立人格的同时享受亲密，互相照亮而非依附。',d:'依托平台或团队获得的财富最为可靠。借助公司福利、行业红利实现财富增长，个人单打独斗收益有限。',e:'居住环境光线充足，明亮通风。适当添置红色或暖色调装饰品，能让家宅气场更加温暖活跃。',f:'心态阳光积极，心理健康状况良好。但注意眼睛和心血管保养，长时间用眼需定时休息。'},
'3-4':{a:'阻碍在前，以法治之。遇到障碍和纠纷，需用明确果断的手段化解，优柔寡断反受其累。',b:'工作中遇到阻力和障碍，需坚决处理。必要时借助规章制度和法律手段保护自己的正当权益。',c:'感情中出现第三方干扰或信任危机。果断面对问题，明确界限，快刀斩乱麻比拖泥带水好。',d:'钱财如被卡住，进账延迟或投资回收受阻。需主动催收、理清账目，必要时借助法律手段保障自身权益。',e:'家宅中可能存在隐患（水电、管道等），及时检修勿拖延。小的修缮能避免大的破财。',f:'身体可能有小的炎症或堵塞问题。注意消化系统和口腔健康，饮食清淡、规律运动能助排除淤滞。'},
'3-5':{a:'鼎新革故，养贤育才。是一个更新换代、培养新能力的好时期，蓄势待发。',b:'适合学习新技能、引入新工具或组建新团队。培养人才和积蓄实力，为未来更大的舞台做准备。',c:'感情需要"调味"，增添新鲜元素。一起学习新事物、旅行新地方，让关系保持活力。',d:'培养新技能和资源，是未来财富的基础。当下把钱花在学习、工具和人才培养上，长期回报远大于短期投机。',e:'家居环境适合添置新物件或更新设备。为家庭引入新技术、新观念，能让家庭氛围焕然一新。',f:'身体进入一个新的调养周期。是开始健身、调整饮食结构的好时机，打好基础比追求快速效果更重要。'},
'3-6':{a:'未完成，仍在路上。事未竟成，但希望在前。戒骄戒躁，步步为营方能抵达彼岸。',b:'项目处于中途，距离成功还有距离。稳住心态，细化步骤，每个小阶段的目标都值得肯定。',c:'关系尚未定型，仍在磨合和了解中。不必急于定义关系，享受探索彼此的过程更为重要。',d:'财务目标尚未达成，仍在过程中。不急于看到结果，持续稳定的投入比一次的爆发更有价值。',e:'家中可能有些半途的工程或未完成的整理。一件一件来，逐步完善好过推倒重来。',f:'身心处于"半程"状态，既非最好也非最差。保持节奏、避免突击式的剧烈改变，平稳过渡最为健康。'},
'3-7':{a:'旅居在外，行路之人。漂泊不定中需保持安定之心，随遇而安，他乡亦是故乡。',b:'出差、外派或换城市工作的机缘较多。在外需保持谦逊低调，广结善缘，处处是机会。',c:'异地恋或聚少离多的状态。珍惜相聚的时光，保持信任和沟通，距离可考验也可增进真情。',d:'异地财或外快机会增多，出差、外派的补贴和奖金可观。但旅途中花销也大，做好预算平衡收支。',e:'可能有暂居他处或频繁往返的情况。不论身在何处，保持居所整洁有序，心的安定即是家。',f:'奔波劳顿，注意旅途中的饮食和休息。适应不同环境的能力增强，但也要给身体足够的恢复时间。'},
'3-8':{a:'旭日东升，蒸蒸日上。运势稳步上升，如同朝阳初升，前途光明，但需持续努力。',b:'晋升机会明显，事业进入上升通道。抓住机遇展示才干，但不要得意忘形，上行之路仍需扎实。',c:'感情正向发展，关系越来越明朗。适合将关系公开、见家长或升级为更正式的承诺关系。',d:'财运稳步上升，加薪或副业收入增长可期。适合做中长期的理财规划，向上趋势值得加注但不可冒进。',e:'家运蒸蒸日上，适合改善居住条件。购置改善型住房或进行家居升级，居住品质的提升与运势同步。',f:'身心状态处于上升期，体能和精力都在恢复。趁势养成好的运动习惯，上升期的积累最为有效。'},
'4-1':{a:'强盛壮大，阳气亨通。运势走强，气势如虹，但壮大之时要守正，强大而不霸道。',b:'事业处于扩张期，攻城略地的好时机。把握市场机会大胆推进，同时注意不要过度膨胀。',c:'主动出击，勇敢表白或推进关系。你的热情和真诚具有感染力，但不要让对方感到压迫。',d:'财运扩张期，大胆布局但需保留底线。进攻型投资策略可行，但留足生活保障金以防万一。',e:'家宅热闹且有扩张之势，可能添丁进口或扩大居住面积。家中阳气充足，但注意不要太喧闹。',f:'体力充沛，适合挑战高强度运动。但大壮之时慎防运动损伤，热身和拉伸不可忽略。'},
'4-2':{a:'归妹之义，宜家宜室。与"家"相关事宜顺利，是成家立业、安居乐业的好时期。',b:'适合稳定下来，选择一个方向深耕。跳槽或变动宜慎重，把现有工作做精做深更能出成绩。',c:'婚姻运旺，适合谈婚论嫁。关系趋于稳定和正式化，共同规划未来是当下最适合做的事。',d:'财务趋于稳定，适合做家庭资产配置。买房、购车等大宗消费可考虑，安居是当下最好的投资。',e:'家宅喜事将近，婚嫁、添丁、乔迁等皆宜。家庭的稳定和温馨是最大的财富，用心经营家庭生活。',f:'身心安顿下来，适合建立稳定的生活作息。规律的生活带来健康红利，不要轻易打破平衡。'},
'4-3':{a:'丰盛盛大，如日中天。运势达顶峰，各种资源汇聚，但盛极必衰，要懂得适可而止。',b:'事业高峰期，资源、机会、人脉齐聚一堂。大刀阔斧推进的同时保持清醒，为后续留有余地。',c:'感情热烈而满足，颇有"蜜月期"之感。尽情享受当下的美好，但也要为平淡期做好准备。',d:'财运极盛，各种渠道资金涌入。但盛极防衰，趁风光时做好资产分散和风险对冲，不能把鸡蛋放一个篮子里。',e:'家中热闹非凡，盛宴不断。但繁华过后注意回归宁静，热闹之后的整理和休整同样重要。',f:'精力旺盛处于巅峰，但要预防过劳。丰盛之时最容易忽略身体信号，定期休息比硬撑更有智慧。'},
'4-4':{a:'震动不安，临危不乱。突发状况频出，需保持镇定，于动荡中寻找机遇。',b:'行业震荡或公司变动频繁，宜静观其变。保持核心竞争力，在不确定中守住自己的位置。',c:'关系中可能出现突如其来的变故。冷静应对，不冲动做决定，给彼此时间消化和调整。',d:'财务上波动剧烈，可能出现突发性的大进大出。保持流动资金充裕，不把所有资金锁定在长期项目中。',e:'家宅不安，可能有突发事件需要处理。保持冷静和灵活应对的能力，沉着比慌乱更能解决问题。',f:'身心受到震动，可能出现失眠、心悸等症状。在动荡中保持规律的作息和饮食，身体需要稳定的锚点。'},
'4-5':{a:'恒久不变，持之以恒。运势平稳，以"恒"为贵，守住初心、坚持正道方能长久。',b:'适合做长远规划，不宜频繁变动。选定方向后深耕细作，稳定持续的付出终有丰厚回报。',c:'感情进入稳定期，平淡中见真情。用心经营日常的点滴，长久的关系需要细水长流的呵护。',d:'财不入急门，长期稳健的理财策略最为适用。定期定额投资、持续积累，复利的力量会随时间显现。',e:'家宅安稳，不求变化即是最好。居家环境的维护比翻新更重要，持之以恒地经营家的温暖。',f:'身心状态平稳，适合长期坚持的健康习惯。每天的步行、规律的饮食、充足的饮水，坚持下去就是大健康。'},
'4-6':{a:'困难解除，云开雾散。之前的阻碍正在消解，问题将迎刃而解，曙光在前。',b:'瓶颈突破，项目重回正轨。之前的困难和误解正在化解，抓住这个转机加速推进。',c:'误会解除，冰释前嫌。适合主动沟通和道歉，过往的心结有望打开，关系焕然一新。',d:'之前的财务困境正在解除，被拖欠的款项有望回收。抓住解困窗口，清理旧账后轻装上阵。',e:'家宅中的困扰和难题正在消散。之前积压的家庭矛盾或居家问题有望得到解决，主动沟通是关键。',f:'身体的郁结或旧疾有好转迹象。趁势调养，配合适当运动加速恢复，解困之时是健康反弹的最佳节点。'},
'4-7':{a:'小有过越，宜下不宜上。小事可略微灵活变通，但大事务必守正，贪大求全反而有害。',b:'细节上可以灵活处理，但大方向不能偏离。做好每一件小事，积少成多，不要好高骛远。',c:'小摩擦正常，不必太过计较。在非原则性问题上让步，把注意力放在大方向的和谐上。',d:'小财可求，大财难入。满足于小的收益和节制，不宜贪大。理财以保守为主，小步快跑好过一把梭哈。',e:'家中小事不断但无大碍。小的修补、日常采买等事务较多，不要因琐碎而烦躁，平常心应对即可。',f:'身体偶有小恙但无大碍。注意换季保养和日常防护，对待健康也需"小过"哲学——微调胜过大改。'},
'4-8':{a:'愉悦安乐，顺势而动。运势舒畅，心情愉悦，适合休养生息与享受成果。',b:'工作节奏舒适，成果得到认可。适合总结复盘、分享经验，以轻松的心态面对下一阶段。',c:'感情和谐美满，享受彼此的陪伴。适合一起休闲娱乐、旅行，在轻松的氛围中增进感情。',d:'财运舒畅，适合享受劳动成果。适度的消费和享受是对自己的奖励，但注意规划好娱乐开支的额度。',e:'家宅充满欢乐氛围，适合家庭聚会和休闲娱乐。轻松愉快的家庭时光是最珍贵的财富。',f:'身心舒畅放松，是减压和调整的好时期。音乐、艺术、自然都有治愈之力，好好犒赏自己。'},
'5-1':{a:'小有积蓄，蓄势待发。力量尚在积累中，不必急于求成，默默耕耘以待时机。',b:'处于准备阶段，储备资源和人脉。不宜大张旗鼓，低调积累，厚积薄发是更好的策略。',c:'感情还处于酝酿阶段，不必急着明确关系。让彼此在自然交往中逐渐加深了解。',d:'财富尚在积累阶段，不可急于求成。持续储蓄和低风险理财，积少成多，厚积才能薄发。',e:'家中宜简朴有序，不要盲目攀比消费。温馨朴素的居住环境反而能滋养心性，简约即高级。',f:'身体处于蓄力期，不宜剧烈消耗。滋补和休养为主，把身体调理到最佳状态再图进取。'},
'5-2':{a:'诚信为本，信及万物。以真诚待人接物，自然能感召美好。内心坦荡，外在顺遂。',b:'信誉是最大的资本。诚实守信、兑现承诺，在行业中建立口碑，长远来看是最有价值的投资。',c:'以诚相待是感情的基石。无论处于哪个阶段，真诚沟通胜过一切技巧，真心必被感知。',d:'诚信带来财富，信誉是最好的资产。承诺的回报会兑现，踏踏实实的收入比投机之财更长久。',e:'家和万事兴，诚信是家庭和睦的基石。家人之间坦诚相待，不隐瞒、不欺骗，家运自然亨通。',f:'心态坦荡，心宽体健。诚实待人接物让自己没有心理负担，坦荡的心境是最佳的养生之道。'},
'5-3':{a:'家庭和睦，各司其职。家庭内部事务顺畅，适合处理家事、改善家人关系。',b:'团队内部管理顺畅，各成员各就各位。加强内部建设，优化流程和分工，团队凝聚力提升。',c:'适合与伴侣共建家庭，讨论家居、家庭计划等。亦适合带对象见家人，家庭成员间关系融洽。',d:'家庭相关的财务事项顺利，适合处理房产、装修、家居采购等。家族中的资源共享也能带来收益。',e:'家宅气象最佳，家庭和睦、各司其职。适合整顿家务、明确分工，井井有条的家最能滋养人。',f:'家庭温暖是身心的港湾。与家人共度的时光是最好的疗愈，在亲情中汲取力量恢复元气。'},
'5-4':{a:'增益之象，利有攸往。运势走强，付出有回报，是一个获得增益的好时期。',b:'投资自身能力，学习进修效果显著。在专业上深耕细作，知识的积累将带来可观的职业回报。',c:'为感情主动付出，增进彼此连接。多花心思经营关系，用心准备的惊喜和关怀最能打动人。',d:'投资自身是最明智的财务决策。把钱花在学习和能力提升上，知识的复利远超金钱的复利。',e:'家中适合营造学习氛围，书香之气能提升家宅格调。书房或阅读角的布置能为全家带来正向影响。',f:'身心处于受益期，之前的好习惯开始见效。继续保持学习和成长的心态，精神富足带动身体健康。'},
'5-5':{a:'巽顺谦逊，风行为用。以柔克刚、顺势渗透，谦逊的态度比强硬的姿态更有效。',b:'以柔和的沟通方式推进工作。多听少说，用建议代替命令，以润物细无声的方式影响他人。',c:'温柔体贴最能打动人心。以对方舒适的方式表达爱意，不强求、不控制，让爱自由流动。',d:'以柔克刚的理财策略最有效。不跟风、不冒进，用温和而持久的方式让财富慢慢增长。',e:'家宅气场柔和，适合营造宁静舒适的居住氛围。柔和的灯光、天然的材质，让家成为真正的避风港。',f:'身心需要柔和的运动方式——太极、瑜伽、散步更适合。刚猛的锻炼反而消耗，以柔养气才是王道。'},
'5-6':{a:'涣散离散，宜聚不宜散。人心涣散之际，需要凝聚力量，重建秩序与团结。',b:'团队凝聚力不足，需加强团建和沟通。在散乱中找到核心力量，重新组织资源，化散为整。',c:'感情有疏远迹象，需主动取暖。安排一次深度交流或共同活动，重新拉近彼此的距离。',d:'钱财容易流失或分散，收拢资金、集中管理。做一次财务盘点，把散落在各处的钱整合起来统一规划。',e:'家宅中可能有人心涣散的感觉。组织一次家庭活动或深度交流，把家人的心重新凝聚在一起。',f:'精神涣散，注意力难以集中。减少碎片化信息摄入，给自己安排一段远离手机的专注时间。'},
'5-7':{a:'循序渐进，欲速不达。按照自然节奏推进，不急于求成，每步扎实方可行远。',b:'职业发展按计划推进，不必焦虑速度。一步一个脚印地积累经验和资历，稳扎稳打才是正道。',c:'感情需慢慢培养，不要操之过急。享受从相识到相知的自然过程，水到渠成的感情最牢固。',d:'财富增长是渐进式的，不要期待一朝暴富。按照理财计划稳步推进，每一步都走得扎实比走得快更重要。',e:'家宅改善是个渐进的过程，不急于一步到位。一个角落一个角落地梳理，慢慢打造理想中的家。',f:'健康改善也是循序渐进的。制定可持续的健康计划而不是极端方案，细水长流的保养最见成效。'},
'5-8':{a:'观察省思，高瞻远瞩。站在高处审视全局，冷静观察后再行动，以旁观者视角获得真知。',b:'多观察行业动态和竞争对手，再做决策。学习借鉴他人的成功经验，站在巨人肩膀上看得更远。',c:'跳出感情看感情，理性审视关系。从旁观者角度审视这段关系是否健康、可持续，再做出决定。',d:'以观察代替行动，多看多学少下手。理财决策前广泛收集信息，借鉴他人成功经验再做判断。',e:'站在更高的视角审视家庭关系。跳出日常琐碎，用旁观者的眼光发现家庭中需要改进之处。',f:'身心需要"旁观"式的自我觉察。练习冥想或正念，观察自己的情绪和身体感受而不急于评判。'},
'6-1':{a:'等待时机，有孚光亨。耐心等待是最佳策略，时机未到不可强求，心怀信念则终将亨通。',b:'等待合适的机会到来，不要急于求成。在等待中做好准备，机会永远留给有准备的人。',c:'给感情一些时间和耐心。不急推进、不逼迫承诺，让一切自然发生，时间会给出最好的答案。',d:'财机未到，守株待兔好过出击。保留现金储备，等待市场机会出现时才有子弹可以打出。',e:'家宅适宜静养，减少不必要的访客和活动。安安静静地等待合适时机，不必急于做大的改变。',f:'身心需要耐心等待恢复。不要急于求成地对身体施压，给足时间和耐心让自愈力发挥作用。'},
'6-2':{a:'节制有度，知止不殆。凡事有节有度，不过分、不放纵，保持平衡方能长久。',b:'控制项目节奏和资源消耗，量入为出。合理规划时间和精力，避免过度消耗导致的倦怠。',c:'感情中需要适当的距离和分寸。给彼此适度的个人空间，亲密有间比形影不离更健康。',d:'节制是财富管理的核心理念。控制消费、合理预算，有所节制才能有所积累，量入为出是最有效的理财法则。',e:'家宅中需有所节制，不铺张浪费。适度的断舍离让居住空间更舒适，简约有度的生活格调最高级。',f:'身体需要"节"养——饮食有节、起居有常、劳逸有度。自律带来自由，对身体的管理也是如此。'},
'6-3':{a:'既成已定，守成防乱。事情已完成，处于收官阶段。守住成果的同时防范新的变数。',b:'项目接近尾声，收尾工作同样重要。做好复盘总结，将经验沉淀为可复用的方法，同时警惕新的风险。',c:'关系进入稳定期，不可掉以轻心。在安逸中不忘经营，小惊喜和关怀让感情保鲜。',d:'财富阶段性目标已达成，守住成果是当下要务。做好资产保值而非追求增值，在稳定中求发展。',e:'家宅已趋完善，维护比翻新重要。日常的打扫和保养让家始终保持舒适，安逸时不忘防微杜渐。',f:'身体状况处于不错的状态但不可掉以轻心。坚持定期体检和健康监测，稳定期恰恰是容易疏忽的时期。'},
'6-4':{a:'万事开头难，屯难之始。创业维艰、万事初始，困难是正常的，坚持下去自有转机。',b:'创业或新项目起步阶段，困难重重。咬紧牙关挺过去，初期的积累虽辛苦但必不可少。',c:'感情初始阶段，还在试探和磨合。不必追求完美开局，真心和耐心会慢慢化解初期的尴尬与不安。',d:'创业初期投入较大，现金流紧张是正常的。精打细算度过起步阶段，把有限的资金用在最核心的地方。',e:'新居或新环境尚在适应中，诸多不便需逐一克服。耐心经营，家的感觉需要时间来培养。',f:'身心处于适应新节奏的阶段，可能有不适感。给身体足够的时间去调整，起步时的困难是正常现象。'},
'6-5':{a:'井养不穷，取之不竭。资源深厚、根基扎实，如同水井之养，源源不断、惠泽四方。',b:'专业根基扎实，核心技术或资源充沛。深耕现有领域，提升专业壁垒，地位稳固且有持续产出。',c:'感情基础牢固，经得起考验。深厚的情感根基需要共同维护，彼此滋养让爱源源不绝。',d:'根基深厚的资产或收入来源可源源不断地产出。维护好核心财源比开拓新路更重要，井深水自清。',e:'家宅根基稳固，居住环境安心可靠。深耕现有的家庭关系和生活模式，扎实的根基经得起风浪。',f:'身体底子好，自愈能力强。保持现有的养生习惯，根基扎实的人恢复得快，不需过多外部干预。'},
'6-6':{a:'险陷重围，习坎入坎。面临重重困难，如入深渊。以诚信之心应对，不逃避、不放弃。',b:'职场或事业面临重大挑战，如履薄冰。诚实面对困难、不掩盖问题，寻求可靠的支援共渡难关。',c:'感情遭遇重大考验，信任危机或外部压力。真诚面对问题核心，两个人同心协力才能真正渡过。',d:'财务陷入重围，四面受压。减少一切不必要的支出，守住最核心的生活保障，等待外部环境好转。',e:'家宅气场沉重，可能有多重压力笼罩。主动向家人坦白处境和需求，共同分担比独自承担更有力量。',f:'身心健康亮红灯，不能硬撑。及时就医、寻求专业帮助，在重围中保护好自己的身体是第一位的。'},
'6-7':{a:'艰难险阻，止步不前。前路多艰，如陷泥泞。暂缓脚步、积蓄力量，待路通再行。',b:'工作推进困难，各种阻碍层出不穷。此时不宜强行突破，先排除障碍、寻求帮助，再图前进。',c:'感情进展不顺，似乎有看不见的墙。停止争论和施压，先各自冷静思考，找到问题的根源。',d:'进财之路受阻，收入渠道收窄。暂停扩张和投资，守住现有的资金池，待路通后再行推进。',e:'家宅中诸事不顺，出行或装修计划可能受阻。暂且安于现状，保持家中的稳定和秩序感。',f:'身体感觉"走不动"，小毛病反复。放缓节奏、不强行挑战身体极限，适时的休息就是最好的前进。'},
'6-8':{a:'亲比依附，相亲相近。人际关系融洽，适合建立深度连接和联盟，众人拾柴火焰高。',b:'与同事、上级或合作伙伴建立紧密关系。主动接近优秀的人，在亲近的关系中互相成就。',c:'两人关系亲密，适合加深羁绊。主动靠近、分享内心，亲密的连接感是当下最珍贵的财富。',d:'结盟合作带来财运，与可靠的伙伴联手投资或创业收益更佳。亲近的关系网络本身就是一种财富。',e:'家宅和睦亲近，家人之间的支持感强。孝敬长辈、关爱晚辈，孝顺友爱之家自有天佑。',f:'亲近的关系带来身心滋养。与知心好友交谈、与家人共处，亲密的人际连接是最有效的减压方式。'},
'7-1':{a:'大畜养德，厚积薄发。积蓄力量与德行，韬光养晦，为更大的事业做准备。',b:'适合进修深造、储备知识和人脉。职业升级前必要的充电期，投资自己的价值和能力。',c:'感情需要沉淀和积累。在深入了解彼此的过程中建立信任，打好基础比快速推进更重要。',d:'积蓄财富的关键时期，减少开支、增加储蓄。把资金用于自我增值而非炫耀性消费，君子藏器于身。',e:'家宅宜静养和蓄力，减少不必要的应酬和活动。沉下心来规划家庭的长远发展，韬光养晦以待时机。',f:'身体是蓄力的本钱，养精蓄锐为首要。深度睡眠、营养饮食、减少消耗，为未来的发力做好储备。'},
'7-2':{a:'损下益上，有损有益。可能需要做出取舍和牺牲，有失才有得，学会智慧的放弃。',b:'项目中需要砍掉冗余、精简资源。断舍离未必是坏事，聚焦核心才能做出成绩。',c:'感情中需要一些让步和牺牲。学会为对方让出一些自我的空间，小"损"换来的是大"益"。',d:'可能需要做出财务上的牺牲或放弃某些收益。损小利以图大利，舍去低回报的项目腾出资源。',e:'家中可能需要适当让渡空间或资源给需要的人。舍去一些物质的东西，换来的是心灵上的富足与安宁。',f:'身体需要"做减法"——减少过度的饮食、减少熬夜、减少过劳。有损有益，放弃不良习惯才有健康增益。'},
'7-3':{a:'文饰之美，贲如濡如。注重外在形式和仪式感，以美好包装提升价值，但不可舍本逐末。',b:'适合提升个人品牌和外在形象。包装和展示能力在此时很重要，但内在实力也要同步提升。',c:'多花心思在浪漫和仪式感上。精心的打扮、用心的约会，让感情充满美的仪式感。',d:'外包装和品牌效应在财务上起作用。个人形象和品牌的投资能带来回报，但实质能力也要同步提升。',e:'家居美化效果显著，适合软装升级和艺术点缀。美好的居住环境提升生活品质，但不必追求奢华。',f:'外表和精神状态俱佳。适度的打扮和仪式感能提振心情，外在的美好反过来滋养内在的健康。'},
'7-4':{a:'颐养天和，自求口实。休养生息、涵养身心。管好自己的事，言语谨慎，饮食有节。',b:'适合低调做事，专注于提升专业能力。少说多做，用实际行动和成果说话，而不是空谈。',c:'在感情中保持独立和自足。先把自己照顾好，不过度依赖对方，健康的爱来自完整的自我。',d:'自给自足的财务模式最为可靠。不依赖外部资助，靠自己的能力和劳动获得收入，虽然辛苦但踏实。',e:'家宅中以"自养"为主，种花养草或自己动手做家务修整。亲手打理的居住空间更能滋养心灵。',f:'身体的调养需要靠自己——管住嘴、迈开腿。任何外在的保健品都不如自律的生活习惯来得实在。'},
'7-5':{a:'整治积弊，革除腐败。发现问题需果断整顿，抚平过往的创伤，防微杜渐。',b:'项目中积累的问题需要清理。审视过往的失误和漏洞，下定决心整顿改进，方能轻装上阵。',c:'感情中的老问题需要正面处理。那些反复出现的矛盾，终究要有一次彻底的沟通和解决。',d:'清理不良资产和错误的投资决策。勇敢面对财务上的失误，及时纠偏止损，痛定思痛方能轻装上阵。',e:'家宅中需要彻底的大扫除和整理。把过期、破损、无用的物品清理出去，空间和心灵都会变得通透。',f:'身体需要一次彻底的健康整顿。改掉积攒已久的不良习惯，下定决心开始全新的健康生活方式。'},
'7-6':{a:'蒙昧初开，启蒙发智。处于学习启蒙阶段，需要导师引导。保持谦逊好学之心。',b:'处于新人阶段或在接触新领域，虚心学习是主旋律。找到好导师或加入好的培训体系事半功倍。',c:'在感情中可能有些稚嫩和懵懂。不必害怕犯错，在相处中学习和成长，真诚是最好的老师。',d:'理财尚在启蒙阶段，虚心学习是首要任务。多请教有经验的理财人士，不急于独立做重大的财务决策。',e:'新居或新环境，还在适应和摸索中。保持谦逊的学习心态，多多请教居家生活方面的经验。',f:'身体处于学习适应期，可能需要调整生活习惯。耐心对待身体的变化，多了解健康知识是最好的投资。'},
'7-7':{a:'止于至善，知止不殆。当行则行，当止则止，把握分寸和节奏比盲目向前更重要。',b:'适可而止，不宜过度扩张。在正确的时间做正确的事，懂得刹车比懂得加速更显智慧。',c:'给感情适度的空间和停顿。不急于推进也不轻易后退，在恰到好处的节奏中品味关系。',d:'财务上知止不殆，获利后及时止盈。懂得在适当的时候刹车，比懂得什么时候加速更重要。',e:'家宅不求大、不求奢，适可而止的居住环境最舒适。满足于已有的，不被物欲裹挟。',f:'身体需要"止"的智慧——不在疲惫时强撑，不在不适时硬扛。懂得停下来，才能走得更远。'},
'7-8':{a:'剥落衰败，小人道长。运势走低，根基动摇。守住底线、隐忍退守，静待阴霾散去。',b:'职场环境不利，小人当道或公司走下坡路。此时不宜出头，韬光养晦，保存实力等待转机。',c:'感情基础被动摇，可能有外力干扰。坚守信任和承诺，不因外界压力而放弃，共渡风雨。',d:'财富面临剥落和损失的风险，资产可能缩水。守住核心资产，剥离高风险的投资和不必要的支出。',e:'家宅中可能出现老旧损坏，需及时修缮。基础的稳固最重要，先把家宅的根本之事处理好。',f:'身体阳气不足，抵抗力下降。注意保暖、增强营养、减少外出应酬，保存体力等待运势回升。'},
'8-1':{a:'天地交泰，万事亨通。运势大吉，上下沟通顺畅，各种事务顺利推进，一片祥和。',b:'事业运势极佳，上下支持，项目推进无碍。是施展抱负的好时机，乘势而上必有所成。',c:'两人关系和谐美满，天地交泰之象。沟通无障碍，相互理解支持，是感情最好的状态。',d:'财运亨通，万事顺遂。投资、合作、开源皆有良好回报，是扩大财富版图的绝佳时机。',e:'家宅安泰，天地之气交合融洽。家庭上下沟通顺畅，长辈与晚辈互相理解，一派祥和。',f:'身心健康舒适，阴阳平衡。趁着运势好，把健康习惯固化下来，让好的状态成为常态。'},
'8-2':{a:'居高临下，亲临督导。亲自参与、深入一线，以温暖和真诚感召人心，上下同心。',b:'亲力亲为的时期，深入一线了解真实情况。领导力和影响力自然提升，团队信任度增强。',c:'主动走近对方的世界，深入了解而非远观。亲密的陪伴和真诚的关怀是最动人的告白。',d:'亲力亲为的管理方式最见成效。亲自过目账目、亲自考察项目，接地气的财富管理策略更踏实可靠。',e:'家宅喜事临门，可能迎接新成员或有贵客到访。以温暖和真诚接待每一位家庭成员和来访者。',f:'身心需要"接地气"——赤脚走路、接触自然、吃新鲜的食材。回归朴素自然的生活方式最能滋养身心。'},
'8-3':{a:'光明受伤，晦暗不明。处境不利，才华被埋没。在黑暗中守住内心的光明，待时而发。',b:'职场受挫，可能被打压或不被理解。保持实力和信念，在逆境中修炼内功，光明终会到来。',c:'感情中受到伤害或误解。不要以暴制暴，守住内心的善意和真诚，用时间来证明自己。',d:'财路受阻不明，才华和付出暂时未获回报。保持实力和价值，在黑暗中磨砺锋芒，光明终会到来。',e:'家宅阴霾笼罩，可能有不利消息。守住家庭的温暖和光明，在逆境中家人之间的支持最为珍贵。',f:'身心受到打压，可能情绪低落或状态不佳。守住内心的光明，在最暗的时候更要照顾好自己。'},
'8-4':{a:'一阳来复，万象更新。寒冬将尽、春意初萌，运势触底反弹，生机重现。',b:'困境即将结束，转机已经出现。抓住新机会重新出发，过往的挫折都是复出的铺垫。',c:'经历低谷后感情回暖。给彼此一个重新开始的机会，过去的伤害可以转化为更深的珍惜。',d:'财务状况触底反弹，最困难的时期已过。复苏阶段宜稳健不宜冒进，新的机会正在路上。',e:'家宅运势转暖，之前的阴霾正在散去。适合小范围地改善居住环境，一点一点地迎接新气象。',f:'身体正在回暖复苏，精神面貌改善。趁势恢复运动习惯，阳气的回归是健康最好的信号。'},
'8-5':{a:'上升之势，步步高升。运势稳步向上，如同树木生长，扎实的根基支撑着持续的提升。',b:'职业发展处于上升通道，晋升可期。持续努力、不断学习，每一步的积累都会带来质的飞跃。',c:'感情质量不断提升，关系迈向新高度。在共同的成长中相互成就，一起成为更好的人。',d:'财富呈现稳步上升之势，长线投资回报可期。专注一个有潜力的方向持续投入，升势之中最忌频繁切换。',e:'家宅运势提升，适合向上改善。不论是换更好的住所还是提升家居品质，向上的趋势值得投资。',f:'身体状态逐日向好，精气神持续提升。保持上升的势头不松懈，好的习惯一旦中断可惜。'},
'8-6':{a:'师出有名，以正伐邪。需要以纪律和正义为准则行事，统率全局、果断出击。',b:'适合担任领导角色，带领团队出征。以明确的规则和正义感凝聚人心，有组织地攻克难关。',c:'在关系中需要有原则和底线。大事讲原则、小事讲包容，有边界感的爱才更健康。',d:'统率全局、果断出击的财务策略。整合资源、集中力量攻克核心盈利点，分散精力不如聚焦重点。',e:'家宅中需要有人担起领导责任，协调家人关系或处理家庭大事。以公正和担当赢得家人的信任。',f:'身心处于"带兵打仗"状态，高效但消耗大。注意节奏管控，打完一仗要有喘息和休整的时间。'},

// ============ 核心计算 ============
function calcGua(num, base){ let r=num%base; return r===0?base:r; }

function getHexagramName(upper, lower){
  return HEXAGRAM[upper+'-'+lower]||'未知卦';
}

function getTrigramSymbol(num){
  return TRIGRAM[num]?TRIGRAM[num].symbol:'?';
}

function getChangedTrigram(trigramNum, lineInTrigram){
  // lineInTrigram: 1-based index within the trigram (1=bottom, 3=top)
  var lines = TRIGRAM_LINES[trigramNum].slice();
  lines[lineInTrigram-1] = lines[lineInTrigram-1]===1?0:1;
  return LINE_TO_TRIGRAM[lines.join(',')];
}

function calculate(n1,n2,n3){
  var upper = calcGua(n1,8);
  var lower = calcGua(n2,8);
  var movingLine = calcGua(n1+n2+n3,6);
  var hexName = getHexagramName(upper,lower);
  var upperSym = getTrigramSymbol(upper);
  var lowerSym = getTrigramSymbol(lower);

  // Calculate 变卦 (changed hexagram)
  var changedUpper = upper;
  var changedLower = lower;
  var movingLabel;
  if(movingLine <= 3){
    changedLower = getChangedTrigram(lower, movingLine);
    movingLabel = '第'+movingLine+'爻变（下卦'+(movingLine===1?'初':movingLine===2?'二':'三')+'爻）';
  } else {
    changedUpper = getChangedTrigram(upper, movingLine-3);
    movingLabel = '第'+movingLine+'爻变（上卦'+(movingLine===4?'四':movingLine===5?'五':'上')+'爻）';
  }
  var changedHexName = getHexagramName(changedUpper, changedLower);

  var insightKey = upper+'-'+lower;
  var insight = INSIGHT[insightKey]||{a:'暂无数据',b:'暂无数据',c:'暂无数据'};

  return {
    upper, lower, movingLine, movingLabel,
    hexName, upperSym, lowerSym,
    changedHexName, changedUpper, changedLower,
    insight
  };
}

// ============ UI 交互 ============
function handleSubmit(){
  var q = document.getElementById('question').value.trim();
  var n1 = parseInt(document.getElementById('num1').value);
  var n2 = parseInt(document.getElementById('num2').value);
  var n3 = parseInt(document.getElementById('num3').value);
  var err = document.getElementById('errorMsg');

  if(isNaN(n1)||isNaN(n2)||isNaN(n3)||n1<100||n1>999||n2<100||n2>999||n3<100||n3>999){
    err.textContent = '请确保三个数字均在 100-999 范围内';
    err.classList.add('show');
    return;
  }
  err.classList.remove('show');

  var result = calculate(n1,n2,n3);
  result.question = q;
  showResult(result);
}

function showResult(r){
  // 卦辞原文
  var ywKey = r.upper+'-'+r.lower;
  var ywBox = document.getElementById('yuanwenBox');
  var ywText = document.getElementById('yuanwenText');
  var yw = YUANWEN[ywKey];
  var bh = BAIHUA[ywKey] || '';
  if(yw){
    ywText.innerHTML = yw.split('\n').map(function(l){ return '<p>'+l+'</p>'; }).join('')
      + (bh ? '<p class="yw-baihua">'+bh+'</p>' : '');
    ywBox.style.display = 'block';
  } else {
    ywBox.style.display = 'none';
  }

  // Hexagram card
  document.getElementById('hexagramCard').innerHTML =
    '<div class="hexagram-symbol"><div>'+r.upperSym+'</div><div>'+r.lowerSym+'</div></div>'+
    '<div class="hexagram-name">'+r.hexName+'</div>'+
    '<div class="hexagram-meta">'+
      '上卦：'+TRIGRAM[r.upper].name+'（'+TRIGRAM[r.upper].element+'） '+
      '下卦：'+TRIGRAM[r.lower].name+'（'+TRIGRAM[r.lower].element+'）'+
      '<span class="line-badge">'+r.movingLabel+'</span>'+
      '<br>变卦：'+r.changedHexName+
    '</div>';

  // 单方框解析
  var dims = [
    {label:'综合运势', key:'a'},
    {label:'事业学业', key:'b'},
    {label:'情感缘分', key:'c'},
    {label:'求财蓄物', key:'d'},
    {label:'家宅气象', key:'e'},
    {label:'身心安康', key:'f'}
  ];
  document.getElementById('insightGrid').innerHTML = dims.map(function(d){
    return '<div class="insight-row">'+
      '<div class="insight-dim">'+d.label+'</div>'+
      '<div class="insight-row-text">'+r.insight[d.key]+'</div>'+
    '</div>';
  }).join('');

  // Prompt
  var qText = r.question || '未填写具体问题';
  var prompt = '我当前正在通过梅花易数数字卦占卜。\n'+
    '我所求之事是：'+qText+'\n'+
    '我摇出的本卦是：'+r.hexName+'（上'+TRIGRAM[r.upper].name+'下'+TRIGRAM[r.lower].name+'）\n'+
    '动爻为：'+r.movingLabel+'\n'+
    '变卦为：'+r.changedHexName+'\n\n'+
    '请你作为精通周易占卜与心理疏导的易学专家，结合我的问题、本卦的卦辞、以及该动爻的爻辞与变卦，为我提供一份深度、理性的解卦分析，并给出行动建议。';
  document.getElementById('promptBox').textContent = prompt;
  window._promptText = prompt;

  // 重置复制按钮
  var btn = document.getElementById('copyBtn');
  btn.textContent = '一键复制 Prompt';
  btn.classList.remove('copied');

  // 切换到结果视图
  document.getElementById('viewInput').classList.add('hidden');
  document.getElementById('viewResult').classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function showInput(){
  document.getElementById('viewInput').classList.remove('hidden');
  document.getElementById('viewResult').classList.remove('active');
  window.scrollTo({top:0, behavior:'smooth'});
}



function copyPrompt(){
  var text = window._promptText||'';
  if(!text)return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      var btn = document.getElementById('copyBtn');
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(function(){
        btn.textContent = '一键复制 Prompt';
        btn.classList.remove('copied');
      },2000);
    }).catch(function(){
      fallbackCopy(text);
    });
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  var btn = document.getElementById('copyBtn');
  btn.textContent = '已复制';
  btn.classList.add('copied');
  setTimeout(function(){
    btn.textContent = '一键复制 Prompt';
    btn.classList.remove('copied');
  },2000);
}

// Enter key support
document.getElementById('num3').addEventListener('keydown',function(e){
  if(e.key==='Enter') handleSubmit();
});
