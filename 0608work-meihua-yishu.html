<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>梅花易数 · 工作占问</title>
  <style>
    /* ============================================================
       全局变量 & Reset
    ============================================================ */
    :root {
      --bg:           #faf9f7;
      --surface:      #ffffff;
      --surface-2:    #f5f3ef;
      --border:       #e8e4dc;
      --text-primary: #1a1814;
      --text-body:    #3d3a35;
      --text-mute:    #8c8880;
      --accent:       #7c5c3a;
      --accent-light: #f0ebe3;
      --highlight:    #4a3728;
      --radius-sm:    8px;
      --radius-md:    14px;
      --radius-lg:    20px;
      --shadow-sm:    0 1px 4px rgba(60,40,20,.06);
      --shadow-md:    0 4px 20px rgba(60,40,20,.10);
      --max-width:    680px;
      --font:         "PingFang SC","Noto Serif SC","Source Han Serif SC",
                      "Hiragino Sans GB",serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-body);
      min-height: 100vh;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       布局容器
    ============================================================ */
    .page { display: none; min-height: 100vh; padding: 0 16px; }
    .page.active { display: block; }
    .inner { max-width: var(--max-width); margin: 0 auto; padding: 60px 0 80px; }

    /* ============================================================
       排版基础
    ============================================================ */
    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: .08em;
      line-height: 1.4;
    }
    h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: .06em;
    }
    p { color: var(--text-body); }
    .muted { color: var(--text-mute); font-size: .875rem; }

    /* ============================================================
       分隔线
    ============================================================ */
    .divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

    /* ============================================================
       页面一：起卦页
    ============================================================ */
    #page-input .header-block {
      padding-bottom: 36px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }
    #page-input .site-tag {
      display: inline-block;
      font-size: .75rem;
      letter-spacing: .12em;
      color: var(--text-mute);
      margin-bottom: 20px;
    }
    #page-input h1 { margin-bottom: 12px; }
    .question-desc {
      font-size: 1rem;
      color: var(--text-body);
      line-height: 1.9;
      margin-bottom: 20px;
    }
    .guide-text {
      font-size: .9rem;
      color: var(--text-mute);
      background: var(--surface-2);
      border-left: 3px solid var(--border);
      padding: 14px 18px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      line-height: 1.8;
    }

    /* 输入区 */
    .inputs-section { margin-bottom: 36px; }
    .inputs-section h2 { margin-bottom: 20px; }
    .input-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 480px) {
      .input-grid { grid-template-columns: 1fr; gap: 12px; }
    }
    .input-item label {
      display: block;
      font-size: .8rem;
      color: var(--text-mute);
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .input-item input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -moz-appearance: textfield;
    }
    .input-item input::-webkit-outer-spin-button,
    .input-item input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .input-item input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,92,58,.12);
    }
    .input-item input.error {
      border-color: #c0392b;
      box-shadow: 0 0 0 3px rgba(192,57,43,.10);
    }
    .input-error-msg {
      font-size: .75rem;
      color: #c0392b;
      margin-top: 6px;
      min-height: 18px;
    }

    /* 按钮 */
    .btn-primary {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .1em;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn-primary:hover  { background: var(--highlight); }
    .btn-primary:active { transform: scale(.99); }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: transparent;
      color: var(--text-mute);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: .875rem;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .btn-secondary:hover { color: var(--accent); border-color: var(--accent); }

    /* ============================================================
       页面二：结果页
    ============================================================ */
    #page-result .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0 0;
      margin-bottom: 40px;
    }

    /* 卦名主卡片 */
    .hexagram-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }
    .hexagram-label {
      font-size: .75rem;
      letter-spacing: .14em;
      color: var(--text-mute);
      margin-bottom: 14px;
    }
    .hexagram-name {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: .12em;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .hexagram-symbol {
      font-size: clamp(2.5rem, 10vw, 4rem);
      line-height: 1;
      margin-bottom: 12px;
    }
    .hexagram-yao-tag {
      display: inline-block;
      padding: 5px 14px;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 999px;
      font-size: .825rem;
      letter-spacing: .06em;
    }

    /* 通用内容卡片 */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .card-title {
      font-size: .7rem;
      letter-spacing: .18em;
      color: var(--text-mute);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .card-content {
      font-size: .95rem;
      line-height: 1.9;
      color: var(--text-body);
    }

    /* 卦辞原文 */
    .guaci-original {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: .06em;
      line-height: 1.9;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    /* 分析正文 */
    .analysis-body {
      font-size: .95rem;
      line-height: 2;
      color: var(--text-body);
      white-space: pre-line;
    }

    /* 提醒高亮卡片 */
    .reminder-card {
      background: var(--accent-light);
      border: 1px solid rgba(124,92,58,.18);
      border-radius: var(--radius-md);
      padding: 24px 28px;
      margin-bottom: 20px;
    }
    .reminder-card .card-title { color: var(--accent); }
    .reminder-text {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--highlight);
      line-height: 1.8;
      letter-spacing: .02em;
    }

    /* 联系方式 */
    .contact-section {
      text-align: center;
      padding: 40px 0 20px;
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }
    .contact-section .qr-image {
      width: 140px;
      height: 140px;
      border-radius: var(--radius-sm);
      display: block;
      margin: 0 auto 20px;
      object-fit: contain;
    }
    .contact-section .contact-name {
      font-size: .9rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
      letter-spacing: .06em;
    }
    .contact-section .contact-note {
      font-size: .825rem;
      color: var(--text-mute);
      line-height: 1.9;
    }

    /* 工具类 */
    .mt-8  { margin-top:  8px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .mb-8  { margin-bottom:  8px; }
    .mb-16 { margin-bottom: 16px; }
  </style>
</head>
<body>

<!-- ================================================================
     PAGE 1 · 起卦页
================================================================ -->
<div id="page-input" class="page active">
  <div class="inner">
    <div class="header-block">
      <span class="site-tag">梅花易数 · 工作占问</span>
      <h1>不动不占，无事不占</h1>
      <p class="question-desc mt-8">
        当前工作的卡顿在哪里？<br/>未来三个月会有怎样的改变与发展？
      </p>
      <p class="guide-text">
        请静下心来，默念问题。<br/>
        随后在脑海中自然浮现三个三位数。<br/>
        数字必须随机产生，不要使用生日、手机号、车牌号等固定数字。<br/>
        请输入最先出现的数字。
      </p>
    </div>

    <div class="inputs-section">
      <h2 class="mb-16">输入你的三个数字</h2>
      <div class="input-grid">
        <div class="input-item">
          <label>数字 一</label>
          <input id="n1" type="number" min="100" max="999" placeholder="100–999" inputmode="numeric"/>
          <div class="input-error-msg" id="err1"></div>
        </div>
        <div class="input-item">
          <label>数字 二</label>
          <input id="n2" type="number" min="100" max="999" placeholder="100–999" inputmode="numeric"/>
          <div class="input-error-msg" id="err2"></div>
        </div>
        <div class="input-item">
          <label>数字 三</label>
          <input id="n3" type="number" min="100" max="999" placeholder="100–999" inputmode="numeric"/>
          <div class="input-error-msg" id="err3"></div>
        </div>
      </div>
    </div>

    <button class="btn-primary" onclick="startDivination()">开始算卦 &amp; 解卦</button>
  </div>
</div>


<!-- ================================================================
     PAGE 2 · 结果页
================================================================ -->
<div id="page-result" class="page">
  <div class="inner">
    <div class="top-nav">
      <button class="btn-secondary" onclick="goBack()">← 重新起卦</button>
      <span class="muted">梅花易数</span>
    </div>

    <!-- 本卦主卡片 -->
    <div class="hexagram-card">
      <div class="hexagram-label">你的卦象</div>
      <div class="hexagram-symbol" id="result-symbol">䷀</div>
      <div class="hexagram-name" id="result-name">乾为天</div>
      <div class="hexagram-yao-tag" id="result-yao">四爻动</div>
    </div>

    <!-- 卦辞 -->
    <div class="card">
      <div class="card-title">卦 辞</div>
      <div class="guaci-original" id="result-guaci">元亨，利贞。</div>
      <div class="card-content" id="result-guaci-plain">此卦象征……</div>
    </div>

    <!-- 工作局势分析 -->
    <div class="card">
      <div class="card-title">工作领域分析</div>
      <div class="analysis-body" id="result-analysis">分析内容将在此处显示。</div>
    </div>

    <!-- 一句提醒 -->
    <div class="reminder-card">
      <div class="card-title">一 句 提 醒</div>
      <div class="reminder-text" id="result-reminder">提醒文字</div>
    </div>

    <!-- 联系方式 -->

  12:{ summary:"你正处于一个需要谨慎拿捏分寸的位置，稍有不慎就可能触碰到隐性边界。",
    analysis:`你在当前团队中处于一个较为复杂的位置——并非核心决策者，却频繁接触敏感信息或关键资源。这意味着你的行动被更多人观察，而你自己可能并未意识到这一点。

当前工作局势中，表面平静，实则暗流涌动。部分决定已在你看不见的层面做出，你接收到的信息可能是滞后或经过筛选的。项目表面上在推进，但内部对优先级的判断存在分歧。

周围人对你的态度比较微妙：上级对你有一定信任，但保持一定距离；同事中有人仰赖你的执行力，也有人在评估你的边界感。你的一举一动在部分人眼中是一种信号。

真正的卡顿在于：你面对的不是明确的任务阻碍，而是一个模糊的权责地带——该做什么、不该做什么，没有清晰的规则，却有隐性的预期。这种灰色地带最消耗精力。

未来三个月，局势将慢慢变得清晰，但清晰的方式可能是某个节点的"事件"触发，而非逐渐明朗。保持谨慎、不轻易表态，同时持续积累实质性贡献，是度过这一阶段的关键。`,
    reminder:"你的聪明劲应该用在做好事情上，而不是判断什么话该说、什么话不该说。" },

  13:{ summary:"你正处于一个可以广泛协作、拓展人脉与影响力的有利时期。",
    analysis:`你当前在团队中扮演的是资源协调者或跨界连接者的角色，能够与不同部门、不同层级的人建立有效联系，这是你当前最突出的优势。

整体工作局势处于比较积极的推进阶段，项目方向明确，团队内部有协作意愿，上下游沟通顺畅。这是一个相对难得的窗口期，阻力较小，推进效率高。

周围人对你的态度偏正面——你被认为是有大局观、能沟通的人。上级对你的信任高于平均水平，同事愿意配合你推进事情。合作方也更倾向于把你视为可以谈的人。

卡顿来自一个容易被忽视的地方：协调型的人有时容易在"处理关系"上投入过多，而在"产出具体成果"上留白。当你的价值主要体现为"沟通顺畅"时，危机往往来自没有人清楚地知道你具体做了什么。

未来三个月，跨部门协作或跨项目机会将增加，你有望承担更大的协调职责，但需要注意将影响力转化为可见的成果，而非只停留在关系层面。`,
    reminder:"把人连在一起是能力，但最终要有事情落下来，协作才算真正有价值。" },

  14:{ summary:"当前时机不适合主动出击，顺势而为、扎实执行是正确方向。",
    analysis:`你在团队中处于一个相对稳健的执行者位置，可靠性是你最重要的标签，周围人对你的期待是"事情交给你就能做好"。

当前工作环境较为稳定，但表面的平静下隐藏着一些尚未显现的变量——组织层面的讨论或调整可能正在进行，只是尚未传导到你所在的层级。

周围人对你的印象是稳重、负责，但这种印象也带来一个隐患：你的想法和判断有时没有得到足够的表达，别人习惯了你"做好执行"，而非把你当做"有判断的人"。

真正的卡顿不是技能问题，而是在一个惯性强的系统里，你越来越难以提出自己的视角。旧有模式运行顺畅，但这种顺畅本身成了改变的阻力。

未来三个月，将有一些新的外部变量进入当前的工作系统，打破部分固有节奏。这是一个重新定义自己在团队中角色的机会，但需要主动展示判断力，而不只是等待分配。`,
    reminder:"一个总是按部就班的人，容易在环境变化时发现自己手里没有牌可出。" },

  15:{ summary:"一个新的变量已悄然出现，当前局势比表面看起来复杂一些。",
    analysis:`你在团队中当前的位置相对固定，有一定积累，但正在面对一个尚未完全显现的变化——新的人、新的方向或新的利益格局正在进入你的工作范围。

工作局势整体上看似平稳，但如果仔细观察，部分细节已经透露出变化信号：某些资源分配方式在悄悄调整，某些关系的微妙程度正在增加，某些之前默认的规则开始被重新讨论。

周围人对你的态度依然正常，但有些反馈可能延迟或不完整。你的信息获取渠道未必是最全面的，需注意有效信息的来源是否足够多元。

真正的卡顿来自于：你尚未完全搞清楚这个"新变量"的性质——它是机会，还是风险，还是一个需要你主动应对的新格局？在还没想清楚之前就行动，容易产生方向偏差。

未来三个月，这个变量将会逐渐清晰，你会有更充分的信息来判断。这一阶段最重要的不是立刻行动，而是持续观察、积累判断，为接下来的决策储备足够的背景信息。`,
    reminder:"不是所有的变化都需要立刻表态，看清楚比第一时间出手更重要。" },

  16:{ summary:"当前局势中存在摩擦与争议，如何处理分歧比争出结果更重要。",
    analysis:`你在团队中处于一个需要应对多方意见的位置，来自不同方向的期待和要求同时落在你身上，协调压力较大。

工作局势中有明显的摩擦点——可能是某个重要决策存在争议，也可能是利益分配方式引发了不满。表面上大家还在协作，但私下里已有立场分化，推进效率受到影响。

周围人对你的态度分化较明显：一部分人觉得你在处理事情上是公正的，另一部分人则有自己的判断。上级对你的态度是观察式的，在等待你如何处理好这个局面。

真正的卡顿是：这不是一个能靠做好执行来解决的问题，它需要你在关系层面做出更清晰的处理——哪些分歧可以搁置，哪些必须正面化解，需要策略。

未来三个月，现有的摩擦将走向一个分岔口：要么在某个时间节点明确化解，要么积累到不可忽视的程度。主动化解比被动等待风险更低，建立中间立场比站队任何一方都更有利于长期。`,
    reminder:"争谁对谁错往往是最低效的争法，把问题解决掉才是真正的赢。" },

  17:{ summary:"当前阶段蛰伏是明智之举，退一步不是退出，而是为下一步腾出空间。",
    analysis:`你目前在团队中的存在感有所降低，但这未必是坏事——一个低调积累的阶段，往往是重新出发的前奏。你没有处于明显的上升通道，但也没有陷入真正的困境。

工作局势整体处于收缩或观望状态，部分项目推进受阻，团队内部在等待更明确的信号再行动。这是一个节奏较慢的阶段，主动出击反而容易显得格格不入。

周围人对你的观感比较中性——没有特别突出的负面评价，但也没有在重要节点被优先想到。上级目前的注意力集中在别处，对你的关注是"正常运转"的水平。

卡顿来自于：你在等待一个不确定会出现的信号，这种等待本身在消耗你的内驱力。同时，低调阶段也容易让人陷入过度自我质疑，而非用这段时间真正做深入思考和准备。

未来三个月，局势有望迎来一次转变，一个新的契机窗口将打开。这一阶段最重要的事情是保持专注，把当前能做的做扎实，而不是把精力浪费在焦虑上。`,
    reminder:"暂时退到边缘位置，不代表被抛弃，有时候这是系统给你充电的方式。" },

  18:{ summary:"当前上下沟通存在明显阻隔，信息传递不畅是当前最大的障碍。",
    analysis:`你目前处于一个信息不对称的位置，你以为大家都知道的，上面未必清楚；你以为已经推进的，下面未必在同步。这种断层是当前工作最大的隐患。

工作局势整体处于一种僵化状态：不是没有人在做事，而是各自做各自的，缺乏有效的协同。项目可能在名义上推进，但实际的协调机制已经失灵，重复工作和方向偏差同时存在。

周围人对你的态度有一种表面默契，但这种默契是表面共识，并非真正的协同意愿。上级的想法没有完整传达，你接受到的可能是片段性信息，导致执行方向存在偏差。

真正的卡顿在于：当前系统的运作逻辑已经出现问题，但大家还在用旧的方式操作。这不是某一个人的失误，而是整体运作机制需要被重新审视和调整。

未来三个月，这种僵局会在某个事件触发下被打破。主动在小范围内建立更清晰的沟通机制，比等待系统性变革来得更快、更可控。`,
    reminder:"很多看起来是执行问题的事，根子在于上下之间的信息没有真正流通。" },

  21:{ summary:"时机成熟，该做决断了，但表达方式和时机选择至关重要。",
    analysis:`你目前处于一个需要明确表态的关口——之前一直在积累、在观察，但现在外部情况已经到了需要你做出选择的节点。你在团队中的位置是关键参与者，不是旁观者。

当前工作局势正在加速，很多此前模糊的事情开始走向明确。决策窗口正在打开，错过这一阶段再想表达立场，成本会更高。

周围人对你的观察已经更加主动——上级在评估你的判断力，同事在等待你表明态度，合作方在看你是否能成为可以推进事情的那个人。

真正的卡顿不是你没有想法，而是你在等一个"最合适的时机"——但在实际工作中，等待往往意味着让别人先占据位置。

未来三个月，将有一到两个关键节点出现，是否能在这些节点上做出有效的表达和行动，将决定你在接下来半年的工作格局。不需要大声，但需要清晰。`,
    reminder:"决断力不是冲动，而是在信息足够多的时候，不再拖延。" },

  22:{ summary:"人际关系处于较为和谐的状态，是推动协作的有利时机。",
    analysis:`你目前在团队中扮演的是一个被信任、被喜欢的角色，沟通顺畅，氛围融洽。这是你的优势，但也需要警惕：过于和谐有时意味着真正的问题被掩盖或推迟。

工作局势整体是平稳向好的，团队氛围积极，项目推进有序。不存在明显的冲突或资源争抢，是一个相对舒服的工作节奏。

周围人对你的态度是亲近和信任的，你的意见容易被采纳，你发起的合作比较容易落地。这种社会资本是你在这个阶段最宝贵的资源，需要珍视而非消耗。

卡顿来自于：当环境太舒服时，人容易失去进取的紧迫感，行动力下降，成长变慢。你可能处于一个"不出错、不突出"的稳定状态，既没有大风险，也没有明显突破。

未来三个月，当前的和谐氛围有可能在外部变量进入后出现松动。建议趁现在格局好的时候推进一些需要协作的重要项目，把好的关系转化为实际成果。`,
    reminder:"关系好是一种资源，但资源只有在被用于有价值的事情时，才真正算数。" },

  23:{ summary:"变革已至，不是要不要改，而是怎么改、改到什么程度。",
    analysis:`你正处于一个系统性变革的阶段——无论是组织层面的调整、业务方向的转变，还是你自己工作方式的迭代，这场变革已经启动，你需要主动去理解它、参与它，而不是等待它自己落地。

当前工作局势中，旧有的规则和流程正在被重新审视，部分职责边界在重新划定，资源的优先级也在调整。这是一个既有机会也有风险的阶段。

周围人对你的态度处于动态观察状态——谁能在变革中快速找到自己的位置，谁就会获得更多的资源和信任。上级在主动筛选：谁适应能力强，谁只是在等待答案。

真正的卡顿在于：你可能知道方向需要调整，但不清楚具体该调整哪里，或者对调整的代价感到担忧，导致行动迟疑。

未来三个月，变革将走向具体落地，此前的模糊方向会变得更清晰。能在早期主动跟上变化节奏的人，往往能在新格局中获得更好的位置。`,
    reminder:"每一次变革都是重新洗牌，牌桌上的位置不是等来的，而是靠判断力换来的。" },

  24:{ summary:"顺势而为是当前最优策略，不需要特别用力，但要保持方向感。",
    analysis:`你当前所处的位置不需要你单独驱动局面，整体势头和外部节奏正在帮你推进。你在团队中扮演的是顺势协调者的角色，跟上大局就已经是有效的贡献。

当前工作局势整体处于顺畅推进阶段，项目节奏稳定，资源没有明显短缺，团队内部分歧不大。是个推进事情效率较高的时期。

周围人对你的态度平稳，上级对你的期待是保持稳定输出，同事对你的配合度较高。在这个阶段，不出错比出彩更重要。

卡顿来自于：顺势而行的阶段里，人容易失去主动思考的习惯，过于被节奏带着走，当局势突然变化时，会发现自己缺乏独立判断的工具。

未来三个月，当前的顺势阶段将持续一段时间，但不会无限延续。建议在推进事情的同时，保持对整体格局的观察，提前为下一个需要主动判断的节点做准备。`,
    reminder:"顺风的时候最容易放弃思考，但思考习惯一旦中断，需要很长时间才能重建。" },

  25:{ summary:"你目前承载的任务量和压力已超出常规水平，需要重新评估优先级。",
    analysis:`你在团队中承担着超额的责任或任务，这种状态已持续一段时间，并正在到达一个临界点。你可能意识到了这个问题，但还没有找到有效的出口。

当前工作局势中，你是一个高度被依赖的节点——任务从四面八方涌来，你是执行链条上不可或缺的一环。这种"不可或缺"既是认可，也是一种隐性的消耗机制。

周围人对你的依赖程度已经超出了健康的合作边界——上级有时默认你能搞定一切，同事有时把"你来处理"当成解决方案，这使得你的精力边界越来越模糊。

真正的卡顿在于：资源没有跟上你被分配的职责。不是能力不够，而是支撑你做这件事的条件——时间、人手、决策权限——并不完整，导致你在用个人能量填补系统性缺口。

未来三个月，如果不主动调整，当前的超载状态会以某种方式爆发。现在最重要的是主动跟上级谈资源和边界，而不是靠个人硬撑继续。`,
    reminder:"撑得过去不代表就该撑，能力强不是承担无限责任的理由。" },

  26:{ summary:"当前处于一段艰难期，外部条件不佳，靠内心坚定比靠外部认可更重要。",
    analysis:`你目前的处境有一定的困难——可能是资源匮乏、推进受阻，或者感觉外部对你的支持和理解正在减少。你能感受到局势不顺，但又难以明确指出问题在哪里。

工作局势整体偏紧，压力来自多个方向：目标没有降低，但支持在减少；任务还在推进，但信息越来越不完整。这种状态下很容易感到孤立无援。

周围人对你的态度趋于冷淡或保守，上级的支持感下降，同事处于自保状态，合作中出现一些细微的后撤。你说的话可能没有以前那么容易被采信。

真正的卡顿在于：当外部支持不足时，你需要找到内心的稳定来源，而不是向外不停地解释和说服。越解释反而越难被信任，踏实做出成果比言语辩解更有说服力。

未来三个月，这段困难期不会立刻过去，但它有一个周期。在此期间，减少不必要的外部摩擦，聚焦能做到的事情，每一个小成果都是在重建信任。`,
    reminder:"最难的时候，往往是你对自己的判断最值得信任的时候。" },

  27:{ summary:"人际之间有良好的共鸣基础，是深化关键关系的有利时机。",
    analysis:`你目前在团队中的角色带有较强的情感联结属性——你的存在对他人有影响力，你对他人也有感知，这种相互影响正在发挥作用。

当前工作局势中，人与人之间的配合度较高，情感层面的协调相对顺畅。这不只是"关系好"的问题，而是当前阶段协作动力的重要来源。

周围人对你的态度是亲近和关注的，你的感受和状态会被注意到。上级对你有一定的情感信任，同事在重要时刻愿意找你谈。

卡顿来自于：情感关联强的人，有时难以做清晰的利益判断。你可能因为顾虑关系而在关键时刻回避必要的表态，或者因为太在意他人感受而推迟了应该推进的事。

未来三个月，当前的情感资本将在一些重要节点发挥关键作用。善用这段时间，把关系资本转化为实际推动力。`,
    reminder:"感情是基础，但最终让一段关系有意义的，是在关键时刻能一起做成事。" },

  28:{ summary:"当前是整合资源、聚拢力量的有利时机，不要单打独斗。",
    analysis:`你目前处于一个可以借力的阶段——周围有足够的资源可以被调动，你在团队中的位置也适合承担一个聚合者或推进者的角色。

当前工作局势中，多个力量正在汇聚——项目进入关键推进期，团队成员有共同目标，外部合作条件相对成熟。这是一个借势推进的窗口期。

周围人对你的关注度较高，你的行动会被注意到，你发起的协作也会比平时更容易得到响应。上级对当前的整体推进持支持态度。

真正的卡顿在于：资源虽然存在，但散落在不同地方，没有被系统性地整合。你可能各个地方都有一定的推进，但缺少一个清晰的主轴把力量汇聚到同一个点上。

未来三个月，如果能在当前阶段建立起有效的协作核心，将为接下来的阶段打下很好的基础。重点是找到那个最值得聚焦的主轴，然后把力量集中在那里。`,
    reminder:"分散的努力很难积累成势，找到一个汇聚点，比同时推进十件事更有力量。" },

  31:{ summary:"你目前处于一个资源充沛的阶段，关键是如何用好而不是继续积累。",
    analysis:`你在团队中处于资源和机会都相对丰厚的位置，有较高的可见度和影响力。这是一个可以有所作为的阶段，问题不是"有没有机会"，而是"如何用好现有条件"。

当前工作局势整体是扩张性的——项目在推进，新任务在进入，团队配合有序，外部机会也在增加。这种丰足状态是珍贵的，但也容易让人因为选择太多而分散注意力。

周围人对你的期待较高，上级对你有较清晰的寄望，同事对你的资源和能力有依赖。这种高期待带来的是高曝光，也意味着任何失误都会被放大。

真正的卡顿不是缺少什么，而是如何在丰盛中保持清醒——当什么都可以做时，最难的是判断什么值得做、什么不值得。

未来三个月，当前的丰足局面将持续，但也会有一定的消退预期。建议聚焦最核心的一到两件事做出标志性成果，而非在多个方向均匀分散。`,
    reminder:"资源多的时候更容易浪费，真正的自律是在有很多选项时，还能坚持选最重要的那个。" },

  32:{ summary:"团队内部存在视角差异，建立共同语言比争对错更有效。",
    analysis:`你目前所在的团队或工作环境中，不同人对同一件事的理解存在明显差异，这种差异正在影响协作效率。你可能处于这个矛盾的中间位置，感受到来自不同方向的拉力。

当前工作局势中，协作存在错位——计划与执行之间、期待与实际之间、不同职能之间，各有一套不同的逻辑在运行。表面上大家在推进同一件事，但理解方式和目标优先级实际上并不统一。

周围人对你的态度相对中性，但偶有误解——你说的话未必被理解为你本来的意思，你的行动有时被解读为不同的信号。

真正的卡顿在于：缺少一套共同语言或共识框架，让不同立场的人能够在同一个基础上讨论问题。你可能花了很多时间在澄清和解释上，而不是在推进上。

未来三个月，如果能主动推动建立更清晰的沟通机制或对齐会议，局面将有明显改善。当前最值得投入的是"把大家放在同一张信息表上"这件事，做好这一步，后续推进会快很多。`,
    reminder:"很多协作困难不是因为目标不同，而是因为每个人脑子里的地图不一样。" },

  33:{ summary:"局势清晰，方向明确，持续照亮自己的优势领域是最优策略。",
    analysis:`你目前处于一个相对清醒和判断力较强的阶段，能看清楚当前局势的主要脉络，知道自己在哪里、要去哪里。这种清醒本身是一种稀缺的资产。

当前工作局势相对稳定透明，主要目标明确，推进路径清晰，没有太多遮蔽性的干扰。这是一个适合深耕专业领域的阶段，外部噪音较少，容易保持专注。

周围人对你的态度比较清晰——上级知道你能做什么，同事知道找你解决什么问题，你在团队中有自己清晰的位置和价值定位。

卡顿来自于：在清晰和稳定中，有时人会觉得当前状态太安逸，开始质疑是否该主动寻求更大的变化或挑战。这种内部的不安稳反而成为干扰专注的来源。

未来三个月，当前清晰的局面是有价值的，可以利用这段时间把核心优势领域做得更深、更扎实。不要为了寻求刺激而主动引入不必要的变量，稳定的深耕往往是积累到下一个台阶的最短路径。`,
    reminder:"清楚自己在做什么的人，远比四处尝试的人，更容易走到值得去的地方。" },

  34:{ summary:"有明显障碍存在，需要以明确的行动正面突破，而非绕道回避。",
    analysis:`你目前的工作推进中有一个或几个明显的卡点，这些障碍不会自动消失，需要你采取主动、清晰的行动去正面处理。

当前工作局势中，有某个环节存在明显的阻塞——可能是流程上的、人际上的，或者是某个具体的决策没有落地导致下游全面受阻。这个卡点是可见的，但还没有人去正面处理。

周围人对你的期待之一就是能够突破这个卡点，上级观察你是否有这个能力，整体推进的动力在等待这个环节松动。

真正的卡顿就是这个具体的障碍本身——不是系统性的问题，而是某一个需要被直接处理的事项。回避它或者绕过它，代价是整体效率的持续损耗。

未来三个月，这个障碍如果得到有效处理，后续推进将会明显提速，也会为你建立起一个"能解决问题"的形象。如果继续拖延，障碍将继续消耗资源，并可能演变为更大的问题。`,
    reminder:"回避问题是有成本的，只是这个成本以时间为单位慢慢支付，不容易被直接感知。" },

  35:{ summary:"当前处于将积累转化为成果的关键节点，稳中求进是最优路径。",
    analysis:`你目前所在的阶段是一个转化期——之前做的积累、建立的关系、推进的项目，正在进入可以看到成果的阶段。你的角色是保证这个转化过程顺利完成。

当前工作局势相对稳健，整体处于从推进向落地的过渡期。项目或工作目标已基本明确，执行路径清晰，需要的是稳定的输出而非大幅度的策略调整。

周围人对你的期待是"把事情收好"——上级希望看到可交付的成果，同事在等待关键节点的落地。

卡顿来自于：在成果即将落地的阶段，最容易出现"差一步"的风险——最后的20%往往是最难的，因为细节、对齐、收尾工作最容易被低估。

未来三个月，你有能力让当前积累的事情真正落地生根，关键是不要在即将完成时因为新的诱惑或外部干扰而分散注意力。把手头的事情做完，才是最大的进步。`,
    reminder:"把一件事做完，比同时推进三件事都做到一半，要值钱得多。" },

  36:{ summary:"接近完成但尚未到达，最后阶段最需要谨慎而非激进。",
    analysis:`你目前的状态是距离目标很近，但还没有真正到达。这个"接近"的感觉有时候反而会带来急于求成的冲动，而这恰恰是最后阶段最危险的心态。

当前工作局势中，你已经推进了大部分，接下来的工作相对具体，但越是到最后，细节和对接的要求越高，任何轻率的处理都可能导致前功尽弃。

周围人对你的观察处于"看结果"阶段——上级在等待最终交付，整个系统都在你这个环节等待。

真正的卡顿在最后那一段路：它不是技术问题，而是耐心和细致程度的问题。往往最后10%的完成质量，决定了整件事在他人眼中的评价。

未来三个月，如果能把当前接近完成的事项有质量地收尾，将为接下来的新阶段打下很好的基础。切忌因为已经看到终点而掉以轻心——终点前最需要的是稳而不是快。`,
    reminder:"功亏一篑不是一种坏运气，而是在最后时刻降低了标准的结果。" },

  37:{ summary:"处于过渡流动阶段，灵活应变与减少执念是当前的关键态度。",
    analysis:`你目前处于一个流动而非固定的状态——也许是工作内容在过渡，也许是你在团队中的角色正在转变，也许是你正在重新评估自己的方向。这种流动感不是问题，而是一个阶段的特征。

当前工作局势中，你所处的环境也在经历一定程度的变化，固定的格局正在松动，新的可能性开始出现，但还没有完全落地。

周围人对你的态度比较观望，上级对你的定位在评估中，同事对你的新角色还在适应。你目前不是被重点关注的核心人物，但也不是被忽略的边缘角色。

真正的卡顿在于：在过渡阶段，人容易对"旧身份"有执念，难以放下原有的工作方式、头衔或地位感，导致无法轻盈地进入新状态。

未来三个月，过渡期将走向一个更稳定的形态，你会在新的环境中逐渐找到自己的位置。当前最好的姿态是放轻执念，保持开放，把注意力放在"在新情况下我能做什么"，而非"我原来应该是什么"。`,
    reminder:"在过渡中最重要的不是找到方向，而是不要因为执念旧方向而错过了新方向。" },

  38:{ summary:"处于被看见、被认可的上升通道中，持续输出是关键。",
    analysis:`你目前处于一个相对有利的上升阶段，成果开始被看见，贡献开始得到认可，这是工作中比较顺畅的阶段之一。

当前工作局势整体向好，你所负责的方向在得到更多关注和资源，团队对你的定位逐渐清晰化，合作中也有更多主动找到你的机会。

周围人对你的态度明显更加主动——上级开始更频繁地征询你的意见，同事对你的项目更感兴趣。这种变化是实质性的，但需要用持续的成果来巩固。

卡顿来自于：在被看见的阶段，有时候会出现表现焦虑——过于关注"被认可"本身，而不是专注于把事情做好。这种焦虑如果不加以调节，会悄悄影响决策质量。

未来三个月，这个上升阶段将持续，但维持它的前提是持续的实质性贡献。不要把注意力放在维护形象上，而是保持专注，让成果本身说话。`,
    reminder:"被看见是好事，但被看见时做的事比被看见本身更重要。" },

  41:{ summary:"势头强劲，但刚强易折，需要以规则和节制约束行动。",
    analysis:`你目前处于一个能量充沛、推进力强的阶段，有很强的主动性和执行力，这是优势。但这种强劲的势头如果没有适当的约束，很容易产生不必要的摩擦和代价。

当前工作局势充满动力，项目节奏快，你在其中是一个主要推动力。整体在向前冲，但冲的过程中，有些步骤是否打牢还需要验证。

周围人对你的态度是一种"又惊叹又有点担忧"的混合感——上级欣赏你的执行力，但也在观察你是否懂得适时停下来核查；同事在跟着你的节奏，但有时也会感受到被带着跑的压力。

真正的卡顿在于：强大的推进力会让你习惯性地绕过那些"麻烦但重要"的步骤——比如对齐、确认、征求意见。这些被绕过的步骤会在后期以更高的代价回来。

未来三个月，当前的强势势头是宝贵的资本，但需要配合更清晰的节奏管理。最好的状态是：快，但不跳步；强，但留有余地。`,
    reminder:"走得最快的人未必走得最远，能停下来确认方向的人，效率才是真高。" },

  42:{ summary:"名实之间存在错位，需要审视自身定位与实际权责是否匹配。",
    analysis:`你目前可能处于一个"角色超前于实际支撑"的状态——你正在做的事情、你的定位或预期，与你目前拥有的实际权力、资源、认可之间存在一定的差距。

当前工作局势中，存在某种错位感：你认为应该推进的事，未必得到了足够的支持；你认为自己的职责范围，未必与他人的理解一致。

周围人对你的认知与你对自己的认知之间有出入——你可能认为自己在承担很多，但这些承担未必被他人清晰看见；你可能以为某个角色是你的，但这个位置还没有被正式确认。

真正的卡顿在于：在名实不符的状态下硬推，容易既得不到支持，又产生挫败感。需要先对齐认知，再开始发力。

未来三个月，如果主动与上级明确职责和定位，这种名实错位可以得到相当程度的修正。先花时间把自己的角色边界讲清楚，后续工作会顺畅得多。`,
    reminder:"做了很多但没人知道，或者做了很多但不在别人的期望范围内，是两种不同形式的资源浪费。" },

  43:{ summary:"处于当前阶段的最佳状态，趁势推进核心目标是关键。",
    analysis:`你目前处于一个状态很好的时期——工作进入良性循环，能量充沛，各方面推进都比较顺畅。这是一个相对难得的窗口，需要充分利用。

当前工作局势是整个周期里比较丰盛的阶段，项目成果在累积，团队合力较强，上级也处于比较支持的状态，外部机会也在主动涌来。

周围人对你的评价处于较高水位——你的能力被认可，你的输出被看见，你的角色得到肯定。这种多方认可的状态是你建立长期影响力的最好时机。

卡顿来自于：丰盛的阶段容易让人有一种"什么都可以做"的错觉，导致注意力分散，想同时推进太多事情，最终反而没有一件事做到最好。

未来三个月，这个良好状态将持续一段时间，但任何好的阶段都有其周期。建议趁现在的势头，聚焦一到两件最重要的事，做出让自己和别人都印象深刻的成果。`,
    reminder:"最好的时期，做最重要的事。不要用来做那些任何时候都能做的事。" },

  44:{ summary:"外部正在发生令人震动的变化，镇定与快速响应是当前关键能力。",
    analysis:`你目前所处的工作环境正在经历一些突发性或颠覆性的变化——可能来自组织调整、市场变化、人员变动或重大决策。这种震动感是真实的，不是错觉。

当前工作局势中，某些之前稳固的假设开始松动，原有的推进路径可能需要重新评估。团队内部的反应不一，有人在快速适应，有人在等待观望。

周围人对你的观察更加密切——在变动时期，人们会更加关注身边每个人的反应方式。你如何应对这次震动，会在他人心中留下比平时更深刻的印象。

真正的卡顿来自于：剧烈变化中最消耗能量的不是变化本身，而是对"变化意味着什么"的焦虑和不确定。当信息不完整时，大脑倾向于填补空白，往往填入的是最坏的可能。

未来三个月，当前的震动会逐渐沉淀为新的格局。最快找到自己在新格局中位置的人，往往不是最聪明的，而是最镇定、最快行动的。`,
    reminder:"变化最大的时候，内心最稳定的人，往往是下一阶段的赢家。" },

  45:{ summary:"长期坚守的节奏正在发挥价值，不被短期波动影响是关键。",
    analysis:`你目前处于一个积累了相当时间的持续推进状态——不是某一个爆发性的动作，而是长期以来保持着稳定的节律。这种恒常性本身就是一种稀缺能力。

当前工作局势整体比较稳定，你所在的领域或项目已经过了最动荡的时期，进入了一个需要持续维护和优化的阶段。这个阶段对耐心的要求高于对创意的要求。

周围人对你的印象是可靠、稳定、持续。上级对你有较高的信任度，因为你的稳定性给了他们预期感；同事对你的依赖建立在你不会突然消失或变化上。

卡顿来自于：长期稳定有时带来一种"是不是该突破一下"的焦虑感，你可能觉得自己太安稳、缺少变化，从而主动引入不必要的波动，反而打断了良好的节奏。

未来三个月，当前的稳定节奏将继续发挥价值，可能会出现一到两个需要你输出判断或承担更大职责的机会。这些机会是对你长期坚持的回报，当它们出现时，稳健接住就好。`,
    reminder:"坚持做一件事本身就是一种选择，不要在快到结果的时候对这个选择产生怀疑。" },

  46:{ summary:"困境松动，是主动推进延宕已久事项的时机。",
    analysis:`你目前面临的卡点正在松动——之前推不动的事情，现在有了可以重新尝试的条件。这不是说问题消失了，而是外部障碍暂时降低，出手的时机来了。

当前工作局势中，某些长期悬而未决的问题开始出现松动的迹象——可能是决策者的态度有所变化，可能是资源重新流动，也可能是外部压力迫使之前的阻力方主动配合。

周围人对你的态度趋于协作——原本不太配合的人，近期沟通变得顺畅了一些；原本模糊的授权，也逐渐清晰。这种氛围是一个好的信号，但窗口期不会太长。

真正的卡顿已经部分缓解，但需要你主动出手——等着让局势自己演变，有可能错过这个短暂的机会窗口。这是一个"该动了"的时刻。

未来三个月，如果主动推进，之前停滞的事情将有望明显前进。建议从最容易启动的部分切入，先形成一个小成果，以成果带动后续更大的推进。`,
    reminder:"时机出现的时候不是所有人都能看见，因为很多人还在等一个更完美的时机。" },

  47:{ summary:"小处着手是当前的正确策略，宏大目标可以有，但行动从具体开始。",
    analysis:`你目前所面对的局面不适合大开大合的策略，而是需要从具体的、小的切入点开始积累进展。这不是退而求其次，而是当前阶段的最优解。

当前工作局势中，整体推进环境有一定的限制——要么是资源受约束，要么是时机不够成熟，要么是更大的项目还需要等待条件到位。在这种背景下，从具体细节处做起，反而能积累真实的进展。

周围人对你的期待更多是在"把当前的事情做扎实"，上级对大项目的推进持观望态度，同事对当前阶段的配合以稳健执行为主。

卡顿来自于：你可能有更大的目标和想法，但当前的执行空间比预期小。这种落差感如果被放大，会变成"做了也没用"的消极态度，从而连小事也推进不好。

未来三个月，局面将从"小处积累"走向"条件逐渐成熟"。在细节处做出质量，比在大方向上空谈规划更能赢得信任和资源，进而为更大的推进创造条件。`,
    reminder:"任何重要的事情都是从具体的一步开始的，执行到位的小事比规划完美的大事更有价值。" },

  48:{ summary:"当前阶段适合提前规划，动员周围人形成合力，而非单独驱动。",
    analysis:`你目前处于一个需要提前布局的时机——下一个阶段的格局，在很大程度上取决于现在的部署。如果只是被动响应，等到需要行动时，最好的节点可能已经过了。

当前工作局势整体处于动员前的准备阶段，项目或工作进入了一个需要整合资源、调动多方参与的关键节点。这个节点的特点是：谁先动员，谁就占据主动。

周围人对你的期待是，你能成为那个让事情"开始动起来"的人，而不是等待别人先迈步。上级对当前阶段的整体推进有关注，同事有参与意愿但需要被带动。

真正的卡顿在于：推动别人比推动自己更难，尤其是在目标还不够清晰的时候。你可能有清晰的图景，但周围人还不够理解或认同，导致动员效果差。

未来三个月，以清晰的节点目标和有吸引力的参与方式动员周围人，将产生显著的合力效应。把目标拆解为每人都能参与的小目标，比讲大方向更有实际效果。`,
    reminder:"布局的时机总是早于你以为的，等到所有条件都成熟再出手，往往为时已晚。" },

  51:{ summary:"积累阶段，时机尚未成熟，继续蓄力比焦虑等待更有价值。",
    analysis:`你目前处于一个积累期——已经做了相当多的准备工作，建立了一定基础，但整体还没到爆发或大规模收获的时机。这种"已经在路上，但还没到"的状态，需要耐心。

当前工作局势中，整体条件处于积累态势：项目在稳步推进，但大成果尚未出现；关系在建立，但信任还在巩固；能力在增长，但表现机会还不多。这是一个蓄势阶段。

周围人对你的评价处于"有潜力、在观察"的阶段，上级尚未完全下定决心，同事也在等待你展现更多。

真正的卡顿在于：积累阶段最难耐的部分是进展的不可见性——你知道自己在努力，但成果还没有充分转化为可见的结果，容易产生"做了也白做"的感受。

未来三个月，积累将走向一个临界点，一次重要的机会或成果将让之前的积累得到集中释放。此阶段的关键是不要在快到引爆点时主动放弃，保持当前的推进节奏，时机将会到来。`,
    reminder:"积累的过程几乎看不见，但积累的结果往往是突然显现的，坚持在不可见的阶段里最难。" },

  52:{ summary:"诚信和真诚是当前最有力的工具，胜过任何技巧。",
    analysis:`你目前所在的工作环境中，影响力的核心来源是信任，而信任的核心来源是真诚。这是一个策略与技巧反而有副作用的阶段。

当前工作局势中，人际层面的可信度正在被重新评估。那些表里不一、说一套做一套的人，正在被逐渐看清楚。

周围人对你的态度取决于他们对你的真实感知——你是否说话算数、你是否在困难时也保持稳定、你是否真正以他人的利益考量。这些判断正在形成。

真正的卡顿在于：当一个人开始过多考虑"如何表现得值得信任"，而不是"真正值得信任"，这种脱节反而会产生反效果。信任无法被设计，只能被积累。

未来三个月，持续以诚信和真实的态度处理事情，将在人际信任层面产生显著积累。这种积累是看不见的，但在某个关键节点会以意想不到的方式发挥作用。`,
    reminder:"人最终记住的不是你做了什么漂亮的事，而是在难的时候你是否保持了本来的样子。" },

  53:{ summary:"角色分工需要清晰，各安其位是当前最有效的推进方式。",
    analysis:`你目前所在的团队或组织中，内部秩序和角色边界正在经历一次重新定义的过程。这可能体现在职责范围的模糊、工作优先级的混乱，或者权责不对等的现象上。

当前工作局势中，如果内部角色不清晰，所有人都会在"这件事谁负责"上消耗大量时间和情绪。你可能已经感受到这种模糊地带带来的摩擦，但还没有找到系统性的解决方式。

周围人对你的态度取决于他们是否清楚你的角色是什么——如果你的职责范围不够清晰，周围人就会按照自己的理解来解读你的行为，容易产生不必要的误会。

真正的卡顿在于：角色模糊是一种系统性问题，不能只靠个人努力来弥补。在没有清晰分工的情况下，努力越多，与他人的权责冲突也越多。

未来三个月，主动与团队重新确认角色边界，是提升整体推进效率的最有效方式。先花时间把分工讲清楚，后续推进会顺畅很多。`,
    reminder:"说清楚谁做什么，比把每件事都抢着做，效率要高得多。" },

  54:{ summary:"有外部资源或支持流入，这是难得的增益窗口，值得主动把握。",
    analysis:`你目前所处的阶段，有一定的外部加持——可能是上级的支持、新的合作机会、增加的资源，或者一段特别顺畅的协作关系。这些不是偶然，而是你前期积累的一种回报。

当前工作局势中，整体处于增益状态：新东西在进入你的工作范围，资源在流入，机会在增加。这种状态是可以被用来推进关键目标的有利窗口。

周围人对你的态度比较主动和支持，上级有增加投入的倾向，同事愿意配合推进，外部合作方也更积极。

卡顿来自于：外部增益往往是短暂的，如果没有主动利用这个窗口推进关键事项，等到支持退潮，再想推进同样的事情会难很多。

未来三个月，这个增益窗口将持续一段时间，但不会无限期延续。建议明确列出最值得在这段时间推进的一到两件事，集中火力，让外部支持最大化地转化为实质成果。`,
    reminder:"好时机来的时候，大多数人在等更好的时机，等到不好的时机才后悔。" },

  55:{ summary:"以柔和渗透的方式持续影响，比正面施压更有效。",
    analysis:`你目前在工作中积累了一定的影响力，但这种影响力的发挥方式，决定了它能走多远。当前阶段，以渗透式的方式推进，比直接施压或强行推动效果更好。

当前工作局势中，有些事情不适合硬碰硬推进，需要通过耐心的沟通、反复的影响、循序渐进的积累来改变周围人的理解和态度。

周围人对你的态度是比较接受性的，但接受的前提是你的方式足够顺畅，不让他们感到被强迫或被施压。一旦你的方式变得太强硬，现有的良好关系会出现裂缝。

真正的卡顿在于：你可能已经形成了一套有效的推进方式，但在遇到阻力时，会本能地切换到更强势的模式，反而打断了原本有效的节奏。

未来三个月，持续以柔和但坚定的方式推进，你的影响力将在关键节点有明显体现。维持当前的节奏，不要因为短期进展慢而轻易改变策略。`,
    reminder:"真正持久的影响力，是让人觉得选择是自己做的，而不是被推着做的。" },

  56:{ summary:"人心有些涣散，主动发挥凝聚作用比抱怨现状更有价值。",
    analysis:`你目前所在的团队或工作系统中，有一种离心力在起作用——人们开始各顾各的，统一的方向感在下降，原本的凝聚力开始松散。

当前工作局势中，团队协作的内驱力有所下降，项目的整体感开始减弱。这不是某一个人的失误，而是一个群体性的状态变化，但需要有人主动去改变这个趋势。

周围人对当前状态有所感知，但大多处于观望，在等有人先站出来做一个凝聚点。如果你能在这个时刻发挥协调和整合的作用，将获得超出预期的认可。

真正的卡顿在于：涣散状态往往会相互强化——越散，越没人想出头，越没人出头就越散。要打破这个循环，需要一个具体的、让人愿意聚集的理由，而不只是喊话"我们要团结"。

未来三个月，如果主动发起一个具体的协作目标或共同事项，将有助于重新凝聚力量。重点不是大话，而是一个让人觉得"加入有意义"的具体事情。`,
    reminder:"凝聚力不是喊出来的，而是围绕一件值得做的事情自然形成的。" },

  57:{ summary:"循序渐进是当前最优节奏，急于求成会打乱已有的好势头。",
    analysis:`你目前的工作推进处于一个按部就班的稳健状态，节奏稳定，方向清晰，正在一步步走向目标。这是一种踏实、可持续的推进方式。

当前工作局势中，整体处于稳步推进的阶段，没有大的意外或波折，但也没有特别大的加速信号。这种平稳本身是有价值的——它意味着积累正在发生，只是看起来不够戏剧化。

周围人对你的期待是继续稳定输出，上级对你的状态是满意的，同事的配合也比较顺畅。你在这个阶段的角色是一个可靠的推进者。

卡顿来自于：在稳健推进的过程中，有时候会因为觉得"太慢了"而焦虑，从而主动打破节奏，引入不必要的变量或做出不符合当前阶段的激进举动。

未来三个月，稳健的推进将逐渐产生可见的成果。最重要的是不要打乱自己的节奏，让每一步都走实，积累将在某个节点产生质变。`,
    reminder:"循序渐进不是慢，而是每一步都在往对的地方走。" },

  58:{ summary:"退后一步观察全局，你的行为也在被更多人观察。",
    analysis:`你目前处于一个既在观察也在被观察的位置。你对局势有自己的判断，但这个判断是否足够全面，还有提升的空间。同时，你的一言一行也在传递信号给周围的人。

当前工作局势中，整体的战略或方向层面的讨论比执行层面的讨论更为重要。谁能在这个阶段提供清晰、有依据的判断，谁就能获得更多的话语权。

周围人对你的观察比你以为的更仔细——你处理信息的方式、你对事情的判断、你在公开场合的表达，都在被人用来评估你是否是一个值得依赖的判断者。

真正的卡顿在于：观察力强的人，有时过于谨慎，迟迟不表达自己的判断，导致好的洞察没有形成实际影响力。观察是基础，但表达才是价值的出口。

未来三个月，如果能把你对局势的判断用清晰、简洁的方式表达出来，将获得意想不到的认可。现在不是退场观望的时候，而是把观察转化为有价值输出的时候。`,
    reminder:"看到了却不说，和没有看到，对结果来说没有区别。" },

  61:{ summary:"等待窗口未到，耐心蓄势是当前真正有效的行动。",
    analysis:`你目前处于一个需要等待的阶段——不是因为你没有能力行动，而是因为行动的前提条件还没有完全就绪。强行推进的代价，会高于等待后再行动。

当前工作局势中，某些关键变量还没有稳定下来：决策还没有最终落地，资源还没有完全到位，外部合作方还在评估，内部共识还没有形成。在这些基础条件成熟之前，着急往往产生反效果。

周围人对你的态度是理解的，但他们也在等待局势明朗。这是一个集体等待的阶段，率先行动未必获得支持，反而可能显得格格不入。

真正的卡顿在于：等待本身需要主动管理，而不只是"停在那里"。等待阶段最有价值的行为是：充分准备，让自己在条件成熟的瞬间能立刻有效行动。

未来三个月，等待的窗口将在某个节点关闭，行动的时机将到来。这一阶段积累的准备工作，将成为你在关键时刻快速出手的底气。`,
    reminder:"等待不是无所作为，而是在条件成熟前把自己准备到最好。" },

  62:{ summary:"建立适度的边界与节制，过于极端的方式会带来反弹。",
    analysis:`你目前所面临的情况需要你在某个方向上建立更清晰的节制——可能是工作节奏的节制、资源使用的节制，或者人际关系中表达方式的节制。

当前工作局势中，某些事情处于"过度"的状态：要么是目标设得太高，要么是管理方式过于严格，要么是对某一件事的推进力度超出了当前系统的承受能力。这种"过"的状态正在积累反弹的风险。

周围人对你的态度已经出现一些微妙的信号——有人开始表现出疲态，有人开始少说话多观望，有人开始推迟响应。这些信号是一种反馈，在提示节奏需要调整。

真正的卡顿在于：你可能已经意识到需要调整，但担心"一旦松下来就会全面松散"，因此不敢放松节奏。这种担忧本身是合理的，但需要找到"有节制的调整"而非"放弃控制"的方式。

未来三个月，适度调整推进方式，找到可持续的节奏，会让整体效率反而提升。极限运作不是效率高，而是在为未来的崩溃储存能量。`,
    reminder:"适度的边界不是软弱，而是让事情能持续发展而不中途崩塌的必要条件。" },

  63:{ summary:"阶段目标已经完成，但新的不确定性正在悄然开启。",
    analysis:`你目前处于一个已经完成了一个阶段的状态——某个项目告一段落，某个目标达成，某个困难度过。这是值得认可的成果，但停留在对成果的满足感中会遮蔽下一步的危机。

当前工作局势中，已经完成的事情形成了一种"完结感"，但新的不确定性已经在悄悄萌芽——可能是已完成的项目进入维护期带来的新挑战，可能是下一个阶段的方向还没有定好，也可能是当前团队格局在成果达成后开始分化。

周围人对你的态度有一种微妙的转变——当目标达成之后，原本的凝聚力往往会减弱，每个人开始关注下一步对自己意味着什么。这是一个容易被忽视但需要主动管理的节点。

真正的卡顿在于：很多人在完成一件事后会进入一段"空档期"，不知道下一步往哪里走，在这段期间的惯性消耗会带来真正的损耗。

未来三个月，最重要的是尽快明确"下一个目标是什么"，用新的方向来承接当前的动能，而不是让动能在漫无目的的等待中慢慢散去。`,
    reminder:"完成一件事之后，最重要的不是庆祝，而是在动能还在的时候，尽快找到下一件值得做的事。" },

  64:{ summary:"正处于艰难的建立期，扎根比扩张更重要。",
    analysis:`你目前处于一个草创或重建阶段——不是一切都从零开始，但你正在努力在一个新的局面里把基础建起来。这个过程是辛苦的，而且通常比预期花更多的时间和精力。

当前工作局势中，整体处于摸索状态：很多事情还没有进入稳定运作轨道，错误和调整是家常便饭，推进的代价比成熟阶段高。这种状态需要更多的耐心，而不是更快的节奏。

周围人对你的评价处于观察阶段，尚未形成稳固的判断。上级在等待你能否真正把基础建起来，同事在适应新的工作方式，外部的配合也还在磨合中。

真正的卡顿在于：建立期里最容易犯的错误，是在基础还没稳之前就急于扩张——想同时做太多事，导致每件事都没有做扎实，整体更脆弱而不是更强。

未来三个月，专注于建立核心基础：找到一两件最关键的事情做透彻，形成可依赖的运作机制。扎实的基础一旦建立，后续的扩张将事半功倍。`,
    reminder:"地基没打好之前，楼越高越危险。" },

  65:{ summary:"核心价值来源稳固，专注深耕比频繁转换方向更有长期回报。",
    analysis:`你目前所在的工作系统中，有一个稳定的核心价值在起作用——它可能是你的专业能力、你长期维护的某个方向，或者你在组织中一贯提供的某种贡献。这个"井"是你当前工作的基础，需要持续深挖。

当前工作局势整体处于稳定运作的状态，没有大的动荡，推进有序。这种稳定是你长期专注的结果，也是当前可以继续依托的优势。

周围人对你的认知是比较稳定的——他们知道你在做什么，在什么方面可以依赖你。这种可预期性是你的社会资产之一，不要轻易打破它。

卡顿来自于：稳定的价值来源有时让人感到"不够有趣"，你可能在考虑是否应该转换方向、尝试新的领域，或者对自己当前所做的事情产生了疑问。

未来三个月，深耕当前方向将产生比你预期更大的回报。频繁变换方向的代价往往被低估，而坚持做好一件事的复利效应往往被低估。`,
    reminder:"浅尝辄止是一种隐性的损失，每一次中途放弃，都相当于把之前的积累归零。" },

  66:{ summary:"连续的考验正在发生，保持务实和内心清醒是度过这个阶段的关键。",
    analysis:`你目前面对的是一个接连不断的挑战阶段——不是单一的困难，而是一系列需要持续应对的压力和不确定性。这种连续性本身就是最大的消耗。

当前工作局势中，不稳定因素在叠加，难以一次性解决所有问题。项目可能遇到多个方向的阻碍，团队内部也有持续的压力，外部环境的变化也在增加不确定性。

周围人对你的态度处于一种复杂的观察状态——他们在看你是否能在压力下保持判断力，是否会在困难时期变形，是否还是那个可以依赖的人。

真正的卡顿在于：在连续的挑战中，人容易陷入一种"防御模式"——只顾眼前，被动应对，逐渐失去主动判断的能力。但恰恰是在这个阶段，主动判断比被动应对更有价值。

未来三个月，这种连续考验的阶段会有一个出口，但出口的位置取决于你如何度过这段时间。保持务实，每次只解决一个问题，不在高压下做重大决策，是穿越这段时间的关键策略。`,
    reminder:"在连续的压力中，最重要的不是每次都赢，而是不被其中的任何一次打垮。" },

  67:{ summary:"前路受阻，转换策略或寻求外部支援比硬撑更有效。",
    analysis:`你目前面临的情况是：原有的路径遇到了真正的阻碍，而不仅仅是短期的挫折。继续沿原路推进的代价在增加，而转换策略的可能性正在出现。

当前工作局势中，某些之前可行的方法开始失效，某些之前有效的关系或渠道开始受阻。这不是因为你的能力出了问题，而是外部条件发生了变化，原有的路径需要重新评估。

周围人对你的态度中，有一些人有能力帮你找到替代路径，但可能你还没有主动去接触或建立这些连接。上级或外部合作方中，有人可以提供你目前缺乏的资源或信息。

真正的卡顿在于：坚持原来的方向需要勇气，改变方向也需要勇气。很多人在这种情况下的错误不是方向选错了，而是在原路已经明显走不通之后还没有及时转向。

未来三个月，如果主动寻找新的路径或外部支援，当前的阻碍将有望被绕过或突破。这个过程可能需要一定的时间，但比继续硬撑更有可能带来实质性的进展。`,
    reminder:"不转弯的勇气叫执着，能转弯的判断力叫智慧，区别在于你能不能看清楚路是不是真的通。" },

  68:{ summary:"当前阶段，建立可信赖的合作关系是最重要的工作之一。",
    analysis:`你目前所处的工作阶段，需要你主动建立和巩固重要的合作关系，而不只是埋头做自己的事情。这些关系将在接下来的关键节点发挥缓冲和支撑的作用。

当前工作局势中，整体处于一个需要协同的阶段——单打独斗的效率在下降，而有效的联盟或合作网络的重要性在上升。谁能在这个阶段建立起可靠的合作关系，谁就为自己建立了一道防线。

周围人对你的态度是中性或略微正向的，有几个关键的人处于"可以建立更深联结"的窗口期，但这个窗口不会一直开着，需要你主动去推进。

真正的卡顿在于：建立合作关系需要主动投入，而这种投入在短期内看不到直接回报，很容易被当做"不紧急"的事情而推迟。但等到真正需要这些关系的时候，再去建立就已经晚了。

未来三个月，主动与几个关键人建立或深化合作关系，将成为你在下一个阶段应对变化的重要资产。先投入，后回报，是这种工作的本质逻辑。`,
    reminder:"真正的合作伙伴不是在你需要帮助的时候找到的，而是在你不需要的时候建立起来的。" },

  71:{ summary:"你已经积累了足够的实力，当前阶段是用实力说话的时候。",
    analysis:`你目前处于一个积累深厚的状态——无论是专业能力、人际关系、对业务的理解，还是对组织运作的把握，你都有相当厚实的基础。这个基础是你当前最重要的资产。

当前工作局势中，事情变得复杂，需要有人能提供有分量的判断或推进力。你的积累正是这种场合需要的。整体是一个可以"亮相"的时机，而不是继续蛰伏的阶段。

周围人对你的期待是真实存在的，尽管表达方式各不相同——上级在等待你展示更大的担当，同事在期待你提供明确的方向，外部合作方在评估你是否值得深度合作。

卡顿来自于：积累深厚的人有时过于谦逊或谨慎，低估了自己当下的实力，导致在该站出来的时候退缩，让积累的价值没有充分发挥出来。

未来三个月，主动承担更大的职责或更复杂的挑战，将是你把积累转化为影响力的关键。不要等到被推着上，主动站出来是当前阶段最有价值的选择。`,
    reminder:"实力积累到一定程度，不用就是一种浪费。" },

  72:{ summary:"当前阶段减法比加法更有价值，精简是为了聚焦和提质。",
    analysis:`你目前需要做的不是增加更多，而是有意识地减少——减少不必要的任务、减少边际关系的维护、减少分散精力的项目，把资源集中到真正重要的地方。

当前工作局势中，你可能面对的是一个超载的状态：同时推进的事情太多，每件事都做到七八成，但没有哪件事真正做到位。这种"多而散"的状态正在影响你的整体产出质量。

周围人对你的观察开始出现一种"你好像什么都在做，但什么都不够深"的感知，这种感知会逐渐影响他们对你工作质量的评价。

真正的卡顿在于：做减法需要勇气，因为每一件被放弃的事情似乎都有"不做的代价"。但实际上，同时推进太多事情的代价比专注一件事要高得多，只是这个代价是分散显现的，不那么明显。

未来三个月，如果能明确放弃几件不够重要的事情，并把释放出来的资源集中投入到最关键的两三件事上，你的整体效果将有质的提升。`,
    reminder:"精简不是放弃，而是在有限的时间和精力里，把最重要的事情做到最好。" },

  73:{ summary:"当前阶段，成果的呈现方式和沟通质量，与成果本身同等重要。",
    analysis:`你目前在工作中产出了相当的内容，但这些内容是否被充分展示、被正确理解，还有提升的空间。当前阶段，"让人看见你做了什么"的能力，与"做什么"本身同等重要。

当前工作局势中，可见度对资源获取和晋升机会有重要影响。那些能够清晰表达自己工作价值的人，往往比同等工作量但不善表达的人获得更多的关注和认可。

周围人对你的认知可能存在一定的低估——不是因为你没有做好，而是因为你做的事情没有被清晰地呈现在他们能感知到的维度上。

真正的卡顿在于：很多注重实质工作的人对"包装"有天然的抵触，觉得"说得好不如做得好"。这个判断本身没错，但在需要多方协作和资源支持的工作中，让人能看见你的价值，是推进后续工作的必要条件。

未来三个月，有意识地提升沟通的质量和成果的呈现方式，将带来超出预期的回报。不需要过度包装，只需要让已有的价值被清晰看见。`,
    reminder:"做到了但没说清楚，和没做到，在很多人那里得到的待遇没有区别。" },

  74:{ summary:"当前阶段需要关注自身的能量补充，高消耗状态不适合做重大决策。",
    analysis:`你目前处于一个高消耗的阶段——持续的输出和压力正在消耗你的精力储备。这种状态下，你的判断力和创造力都会受到影响，而这个影响往往在你自己察觉到之前，已经体现在了决策质量上。

当前工作局势中，外部要求持续保持高位，停下来休整的空间似乎很小。但这种"停不下来"的感觉，有时并不是真实情况，而是一种惯性焦虑。

周围人对你的状态有所感知，但通常不会主动提出来，因为他们也习惯了你一直在运转的状态。你的疲态比你以为的更明显，但没有人会替你主动叫停。

真正的卡顿在于：高消耗状态下做出的决策，往往带有更多的反应性和防御性，缺乏真正的主动判断。你可能正在用"越来越努力"来填补"判断力下降"带来的缺口。

未来三个月，主动为自己创造恢复和思考的空间，将比继续满载运转产生更好的实际效果。适当的停顿不是偷懒，而是维持高质量输出的必要成本。`,
    reminder:"一个长期处于高消耗状态的人，做的决策往往比他们应有的水平差很多。" },

  75:{ summary:"旧的问题正在浮出水面，这是彻底清理和重建的机会。",
    analysis:`你目前所在的工作环境中，有一些长期积累的问题正在显现——这些问题不是新出现的，而是过去一直存在但被搁置或回避的。它们浮出水面，是一个不得不处理的信号。

当前工作局势中，这种问题的暴露有时表现为某个事件的触发，有时表现为一种弥漫的低效感，有时表现为某些关系的公开化紧张。无论哪种形式，核心都是"旧的运作方式已经无法继续支撑当前的要求"。

周围人对当前状态都有感知，但大多数人的应对方式是回避，而不是正面处理。在这种情况下，愿意站出来系统性处理问题的人，往往能获得超出预期的认可和信任。

真正的卡顿在于：旧的问题浮出来，并不意味着解决起来容易——它通常意味着要做一些让人不舒服的事：明确责任、重新分配、结束某些不再有效的合作方式。

未来三个月，如果主动推动一次系统性的梳理和调整，将为接下来的阶段打好基础。这个过程会有摩擦，但摩擦之后的系统会比之前更健康。`,
    reminder:"问题不解决不会消失，它只是在等一个更大的代价让你不得不处理。" },

  76:{ summary:"当前处于信息不完整的状态，主动学习和寻求高质量信息是关键。",
    analysis:`你目前面对的局面有一定的模糊性——可能是对某个方向的了解还不够深入，可能是某些关键信息还没有获取，也可能是整体的认知框架还有待完善。

当前工作局势中，信息的质量和完整性直接影响决策的质量。当你在信息不足的状态下行动，容易走弯路、做重复工作或产生不必要的误判，这些代价往往在事后才显现。

周围人对你的期待有时超出了你当前的认知积累，这种落差如果没有被识别和填补，会逐渐影响你的工作效果。但这种差距是可以主动弥补的。

真正的卡顿在于：人在不确定的时候倾向于"做事"来获得一种控制感，但在这个阶段，"学"和"问"比"做"更有价值。找到真正高质量的信息来源，比靠猜测推进要有效得多。

未来三个月，主动寻求高质量的信息、找到真正有经验的人交流、或者在关键方向上做深入的研究，将显著提升你接下来的决策质量和推进效率。`,
    reminder:"在不知道的状态下行动，比先知道再行动，往往要多走很多弯路。" },

  77:{ summary:"此刻最好的行动是暂停和重新审视，惯性前行不是正确方向。",
    analysis:`你目前面临的局面需要你先停下来——不是永久停止，而是暂时中止惯性的推进，用清醒的视角重新审视当前的方向、方法和优先级是否仍然正确。

当前工作局势中，有一种惯性在驱动你继续前行，但这种惯性的方向可能已经偏离了真正重要的目标。继续前行的代价，是把时间和精力投入到一条可能已经不对的路上。

周围人对当前的推进方式可能已经有一些保留意见，但出于各种原因没有明确表达出来。你可能收到了一些微弱的信号，提示需要调整，但还没有认真对待这些信号。

真正的卡顿在于：停下来需要勇气，尤其是在已经投入了大量时间和精力的情况下。但停下来的成本，通常远低于在错误方向上持续推进的成本。

未来三个月，如果能在近期进行一次真正的复盘——不是为了汇报而做的复盘，而是真诚地审视"我们在做正确的事情吗"——将为后续节省大量的资源和时间。`,
    reminder:"有时候，停下来是最快到达目标的方式。" },

  78:{ summary:"当前处于消减期，守住核心比扩张更重要。",
    analysis:`你目前所处的阶段，整体态势是在减少而不是在增加——可能是资源在减少，可能是支持在减少，可能是推进的空间在收窄。这是一个需要保守应对的阶段，而不是扩张的时机。

当前工作局势整体处于一种收缩或剥落的状态，某些原本稳固的基础正在松动。这种状态的特点是：强行推进不仅无效，还会加速消耗，适得其反。

周围人对你的支持正在经历一个低潮期，上级的注意力转移，同事处于观望，外部的合作热情有所下降。这种状态不是永久的，但在当前阶段真实存在。

真正的卡顿在于：在消减期里，人容易有一种"越努力越没有回报"的无力感。这种感受会导致要么放弃，要么过度努力从而加速消耗，这两种应对方式都会加剧困境。

未来三个月，最重要的策略是守住核心——确保最重要的事情不被影响，维护最关键的关系不断裂，保存足够的能量等待局势改变。这个阶段的成功标准不是扩张，而是完好无损地度过。`,
    reminder:"在退潮的时候保住自己，比强行逆流要值得多，因为涨潮的机会还会来。" },

  81:{ summary:"天时地利，当前是推进重要目标的最佳窗口期。",
    analysis:`你目前处于一个难得的有利阶段——外部条件顺畅，内部状态良好，上下沟通顺畅，各方面都处于比较协调的状态。这是工作中比较少见的"顺"的时刻。

当前工作局势整体处于通畅状态：推进的阻力小，合作的意愿强，资源相对充足，关键决策也处于可落地的状态。这是一个"做什么都顺"的阶段，但这个阶段不会永远持续。

周围人对你的态度普遍正向，上级支持，同事配合，合作方友好。你在他人眼中处于一个可信赖、值得投入的状态，这是你现在最宝贵的社会资本。

卡顿来自于：顺境中人容易懈怠，或者不敢冒险，认为"顺着来就好"，反而错过了大有可为的窗口。这种阶段需要的不是防守，而是主动进攻。

未来三个月，是推进最重要目标的黄金时期。建议明确列出最希望达成的一到两件事，集中资源全力推进，让这段顺畅的时期真正产生里程碑式的成果。`,
    reminder:"顺风局里的决定性行动，往往决定了未来很长一段时间的走势。" },

  82:{ summary:"处于相对主动的优势位置，但需要未雨绸缪，防止过于自满。",
    analysis:`你目前处于一个比较有利的位置——在团队或业务中处于主动方，有较好的话语权，推进的条件相对充足。但这种有利位置本身也在考验你如何管理"顺势中的稳健"。

当前工作局势整体对你有利，你处于一个可以推进、可以发声、可以影响结果的位置。但任何有利局面都有其时间窗口，如何在窗口打开时做最有效的事，是关键问题。

周围人对你的态度是比较主动和支持的，但同时也有一定程度的"期待管理"的压力——你被认为能做到，就意味着如果没做到，落差感会更明显。

卡顿来自于：在有利局面里，人容易高估当前状态的持续性，低估潜在的变化风险，从而在该行动的时候过于保守，或者对下一阶段准备不足。

未来三个月，当前的优势局面将持续，但不会无限期，某个时间节点局势会趋向平衡甚至向对方倾斜。建议在有利局面持续期间，主动建立更稳固的基础，而不只是享受当前的顺势。`,
    reminder:"得势的时候最需要想的，是怎么把这个势转化为不依赖势头的实力。" },

  83:{ summary:"当前处于一个需要潜行的阶段，收敛锋芒比展示自我更有价值。",
    analysis:`你目前所处的工作环境对于直接、强势的表达并不友好——可能是因为上面的氛围压制，可能是因为局势尚未明朗不适合亮明立场，也可能是因为当前阶段不是展示的时机。

当前工作局势中，那些在不合时宜的时候过于突出自己的人，往往会承担不必要的风险。而那些懂得潜行、专注于实质性贡献的人，反而能积累真正的信任和资本。

周围人对你的观察是多元的，有人在等待时机判断你、有人在保护自己而保持距离，有人在看你是否能在压力下保持稳定。你的每一个行动都在被解读。

真正的卡顿在于：在需要收敛的阶段强行表达，往往不是勇气，而是在错误的时机亮相，反而给自己带来不必要的阻力和审视。

未来三个月，把精力放在实质性工作上，让成果慢慢积累，而不是频繁表达或争取注意力。时机转变之后，这段时间积累的成果将是你重新亮相的底气。`,
    reminder:"低调不是软弱，而是把力量留到真正需要用的时候。" },

  84:{ summary:"一个新的周期正在开始，微弱的正向信号值得重视和把握。",
    analysis:`你目前处于一个从低点往上的起步阶段——可能之前经历了一段困难期或停滞期，但现在有一些微弱的正向变化开始出现。这些变化虽然细微，但值得重视和把握。

当前工作局势中，有一两个积极的信号已经出现——可能是某个之前卡住的项目开始松动，可能是某段关系出现了修复的可能，也可能是新的机会开始出现。这些信号是下一个阶段的起点。

周围人对你的态度在经历一段时间的冷淡或观望后，开始出现一些回暖的迹象。这种回暖可能不够明显，但如果你主动跟进，可以加速这个过程。

卡顿来自于：从低点往上走的阶段，人容易因为过去的挫折而对新的正向信号过度质疑，不敢轻易信任这些迹象，导致错过顺势而为的窗口。

未来三个月，如果主动把握这些微弱的正向信号，顺势推进，这个新周期的上升速度将会超出预期。新的周期需要新的行动和新的思路，而不是重复上一个周期的模式。`,
    reminder:"每一次重新开始都比从未失败要难，因为你需要在对自己的怀疑中重新建立信心。" },

  85:{ summary:"稳步上升的通道是开放的，踏实积累是最短路径。",
    analysis:`你目前处于一个稳步向好的上升轨道中，这种上升不是爆发式的，而是稳健积累后的自然结果。当前的阶段适合专注向前，而不是怀疑自己是否走在正确的方向上。

当前工作局势整体是支持性的，上升的通道存在，关键是你如何持续输出，让每一步都走实。这不需要特别激进的策略，而是需要稳定的执行和清晰的方向感。

周围人对你的认可在持续累积，上级对你未来的方向有一定的预期，同事对你的工作方式也开始形成正向的印象。这种积累是渐进的，但非常真实。

卡顿来自于：上升期里，人容易因为看到进展而想加速，或者因为看到更远的目标而焦虑当前的速度。这两种倾向都会干扰当前最优的节奏。

/* ================================================================
   四、起卦核心逻辑
================================================================ */

/**
 * 获取八卦编号（余数为0则取8）
 * @param {number} n 输入数字
 * @param {number} mod 模数（8 或 6）
 * @returns {number}
 */
function getMod(n, mod) {
  const r = n % mod;
  return r === 0 ? mod : r;
}

/**
 * 翻转某一爻后的单卦编号
 * 爻位从下往上：1=最下，3=最上
 * 使用先天八卦序的二进制映射
 */
const TRI_BIN = { 1:7, 2:6, 3:5, 4:1, 5:2, 6:3, 7:4, 8:0 };
const BIN_TRI = {};
Object.entries(TRI_BIN).forEach(([k,v]) => BIN_TRI[v] = parseInt(k));

function flipTrigram(triNum, yaoPos) {
  let bits = TRI_BIN[triNum];
  let mask = 1 << (yaoPos - 1);
  bits = bits ^ mask;
  return BIN_TRI[bits !== undefined ? bits : 0] || 8;
}

/**
 * 互卦取法：从第 startPos 爻往上取3爻（1-indexed）
 */
function getInterTrigram(upper, lower, startPos) {
  const lBits = TRI_BIN[lower];
  const uBits = TRI_BIN[upper];
  const all = (uBits << 3) | lBits;
  const slice = (all >> (startPos - 1)) & 7;
  return BIN_TRI[slice] !== undefined ? BIN_TRI[slice] : 8;
}

/**
 * 错卦：阴阳全翻
 */
function oppositeTrigram(triNum) {
  const bits = TRI_BIN[triNum];
  const flipped = (~bits) & 7;
  return BIN_TRI[flipped] !== undefined ? BIN_TRI[flipped] : 8;
}

/**
 * 主算卦函数
 * @param {number} n1 第一个数字
 * @param {number} n2 第二个数字
 * @param {number} n3 第三个数字
 */
function calcDivination(n1, n2, n3) {
  // 上卦、下卦、动爻
  const upper = getMod(n1, 8);
  const lower = getMod(n2, 8);
  const yao   = getMod(n3, 6);  // 动爻：第三个数字单独除以6取余（余0按6）

  // 本卦 key
  const mainKey = upper * 10 + lower;

  // 变卦：动爻所在爻阴阳互换
  let changedUpper = upper;
  let changedLower = lower;
  if (yao <= 3) {
    changedLower = flipTrigram(lower, yao);
  } else {
    changedUpper = flipTrigram(upper, yao - 3);
  }
  const changedKey = changedUpper * 10 + changedLower;

  // 互卦：2-4爻为下互，3-5爻为上互
  const interLower = getInterTrigram(upper, lower, 2);
  const interUpper = getInterTrigram(upper, lower, 3);
  const interKey = interUpper * 10 + interLower;

  // 综卦：上下颠倒
  const zongKey = lower * 10 + upper;

  // 错卦：各爻阴阳全换
  const cuoKey = oppositeTrigram(upper) * 10 + oppositeTrigram(lower);

  // 体卦 / 用卦（动爻所在卦为用卦）
  const tiGua   = yao <= 3 ? upper : lower;
  const yongGua = yao <= 3 ? lower : upper;

  return {
    upper, lower, yao,
    mainKey, changedKey, interKey, zongKey, cuoKey,
    tiGua, yongGua
  };
}

/* ================================================================
   五、查找分析内容（兜底使用通用模板）
================================================================ */

  if (hexagramAnalysis[key]) return hexagramAnalysis[key];

  // 通用兜底模板（适用于尚未填充分析的卦）

  };
}

/* ================================================================
   六、爻位名称
================================================================ */
const YAO_NAMES = ["", "初爻动", "二爻动", "三爻动", "四爻动", "五爻动", "上爻动"];

/* ================================================================
   七、页面交互逻辑
================================================================ */

/**
 * 验证单个输入框
 */
function validateInput(id, errId) {
  const el = document.getElementById(id);
  const errEl = document.getElementById(errId);
  const val = parseInt(el.value, 10);

  el.classList.remove("error");
  errEl.textContent = "";

  if (!el.value || isNaN(val)) {
    el.classList.add("error");
    errEl.textContent = "请输入数字";
    return null;
  }
  if (val < 100 || val > 999) {
    el.classList.add("error");
    errEl.textContent = "请输入 100–999 之间的三位数";
    return null;
  }
  return val;
}

/**
 * 开始算卦
 */
function startDivination() {
  const n1 = validateInput("n1", "err1");
  const n2 = validateInput("n2", "err2");
  const n3 = validateInput("n3", "err3");

  if (n1 === null || n2 === null || n3 === null) return;

  // 执行起卦算法
  const result = calcDivination(n1, n2, n3);

  // 取本卦数据
  const hexData = HEXAGRAMS[result.mainKey];
  if (!hexData) {
    alert("起卦数据异常，请重新输入。");
    return;
  }

  // 取分析内容
  const analysis = getAnalysis(result.mainKey);

  // 渲染结果页
  document.getElementById("result-symbol").textContent = hexData.sym;
  document.getElementById("result-name").textContent   = hexData.name;
  document.getElementById("result-yao").textContent    = YAO_NAMES[result.yao] || `第${result.yao}爻动`;
  document.getElementById("result-guaci").textContent  = hexData.guaci;
  document.getElementById("result-guaci-plain").textContent = hexData.plain;
  document.getElementById("result-analysis").textContent   = analysis.analysis;
  document.getElementById("result-reminder").textContent   = analysis.reminder;

  // 切换页面
  document.getElementById("page-input").classList.remove("active");
  document.getElementById("page-result").classList.add("active");

  // 滚动到顶部
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/**
 * 返回起卦页
 */
function goBack() {
  document.getElementById("page-result").classList.remove("active");
  document.getElementById("page-input").classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================================================================
   八、输入框回车跳转
================================================================ */
document.getElementById("n1").addEventListener("keydown", function(e) {
  if (e.key === "Enter") document.getElementById("n2").focus();
});
document.getElementById("n2").addEventListener("keydown", function(e) {
  if (e.key === "Enter") document.getElementById("n3").focus();
});
document.getElementById("n3").addEventListener("keydown", function(e) {
  if (e.key === "Enter") startDivination();
});
</script>
