<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情劫命格 · 天命占卜</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07071a;
    --surface: rgba(255,255,255,0.04);
    --gold: #c9a84c;
    --gold2: #f0d080;
    --purple: #9b6ef3;
    --purple2: #c4a0ff;
    --red: #e05c7a;
    --text: #e8dfc8;
    --text-dim: rgba(232,223,200,0.55);
    --border: rgba(201,168,76,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  #stars-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .nebula {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.13;
    pointer-events: none;
    z-index: 0;
  }
  .nebula-1 { width: 500px; height: 500px; background: var(--purple); top: -120px; right: -100px; }
  .nebula-2 { width: 400px; height: 400px; background: var(--red); bottom: -80px; left: -100px; }
  .nebula-3 { width: 300px; height: 300px; background: var(--gold); top: 40%; left: 50%; transform: translate(-50%, -50%); opacity: 0.07; }

  #app {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  .screen {
    display: block;
    padding-top: 44px;
  }

  .screen.hidden {
    display: none !important;
  }

  #screen-intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0;
    min-height: 100vh;
    padding-top: 0;
  }

  #screen-quiz {
    padding-top: 44px;
  }

  #screen-result {
    padding-top: 40px;
    animation: fade-in 0.8s ease;
  }

  #screen-loading {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 24px;
    padding-top: 60px;
  }

  .symbol-ring {
    width: 130px;
    height: 130px;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    position: relative;
    margin-bottom: 28px;
    animation: spin-slow 30s linear infinite;
  }
  .symbol-ring::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 50%;
  }
  .symbol-ring::after {
    content: '☽';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    animation: spin-slow 30s linear infinite reverse;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.7);
  }

  .dot-ring {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
  }

  .dot {
    position: absolute;
    width: 5px;
    height: 5px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--gold);
  }

  @keyframes spin-slow { to { transform: rotate(360deg); } }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .intro-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.8;
  }

  .intro-title {
    font-family: 'Ma Shan Zheng', serif;
    font-size: clamp(36px, 9vw, 50px);
    color: var(--gold2);
    text-shadow: 0 0 40px rgba(240,208,128,0.4), 0 0 80px rgba(201,168,76,0.2);
    line-height: 1.15;
    margin-bottom: 8px;
  }

  .intro-sub {
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--text-dim);
    margin-bottom: 24px;
  }

  .intro-divider,
  .glow-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .intro-divider {
    width: 120px;
    margin: 0 auto 24px;
  }

  .intro-desc {
    font-size: 13px;
    line-height: 1.9;
    color: var(--text-dim);
    max-width: 356px;
    margin-bottom: 18px;
  }

  .intro-note {
    background: rgba(201,168,76,0.06);
    border: 1px solid rgba(201,168,76,0.18);
    color: rgba(232,223,200,0.82);
    font-size: 12px;
    line-height: 1.8;
    padding: 10px 14px;
    border-radius: 4px;
    max-width: 370px;
    margin-bottom: 18px;
  }

  .intro-ornaments {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--gold);
    font-size: 18px;
    margin-bottom: 10px;
    opacity: 0.5;
  }

  .btn-start,
  .btn-next,
  .btn-prev,
  .btn-restart {
    font-family: 'Noto Serif SC', serif;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-start {
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(155,110,243,0.12));
    border: 1px solid var(--gold);
    color: var(--gold2);
    font-size: 15px;
    letter-spacing: 3px;
    padding: 16px 52px;
    position: relative;
    overflow: hidden;
    text-shadow: 0 0 20px rgba(240,208,128,0.5);
  }
  .btn-start::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.25), rgba(155,110,243,0.2));
    opacity: 0;
    transition: opacity 0.4s;
  }
  .btn-start:hover::before { opacity: 1; }
  .btn-start:hover {
    box-shadow: 0 0 30px rgba(201,168,76,0.3), 0 0 60px rgba(201,168,76,0.1);
    transform: translateY(-1px);
  }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .quiz-counter {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .quiz-counter span {
    color: var(--gold);
    font-size: 18px;
    font-weight: 600;
  }

  .progress-track {
    flex: 1;
    height: 2px;
    background: rgba(255,255,255,0.08);
    margin: 0 14px;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--gold));
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 8px var(--gold);
  }

  .question-card,
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .question-card {
    padding: 24px 22px 22px;
    animation: card-in 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .question-card::before,
  .result-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .question-num {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--purple2);
    margin-bottom: 12px;
    opacity: 0.7;
  }

  .question-text {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 20px;
    font-weight: 400;
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .option-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
    font-size: 13.5px;
    line-height: 1.65;
    padding: 12px 16px;
    border-radius: 2px;
    cursor: pointer;
    text-align: left;
    transition: all 0.25s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  .option-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.1), rgba(155,110,243,0.08));
    opacity: 0;
    transition: opacity 0.25s;
  }

  .option-btn:hover {
    border-color: rgba(201,168,76,0.4);
    transform: translateX(4px);
    box-shadow: -2px 0 0 var(--gold), 0 4px 20px rgba(0,0,0,0.3);
  }

  .option-btn:hover::after,
  .option-btn.selected::after { opacity: 1; }

  .option-btn.selected {
    border-color: var(--gold);
    background: rgba(201,168,76,0.1);
    box-shadow: -3px 0 0 var(--gold), 0 0 20px rgba(201,168,76,0.15);
  }

  .option-label {
    width: 22px;
    height: 22px;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
    color: var(--gold);
    margin-top: 1px;
    transition: all 0.25s;
  }

  .option-btn:hover .option-label,
  .option-btn.selected .option-label {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
  }

  /* 导航按钮行：左"返回"，右"继续" */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    gap: 12px;
  }

  .btn-next,
  .btn-prev {
    background: transparent;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 10px 22px;
  }

  .btn-next {
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold);
    opacity: 0;
    pointer-events: none;
    margin-left: auto;
  }

  .btn-next.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .btn-next:hover {
    background: rgba(201,168,76,0.1);
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(201,168,76,0.2);
  }

  .btn-prev {
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim);
  }

  .btn-prev:hover {
    border-color: rgba(201,168,76,0.3);
    color: var(--text);
  }

  .btn-prev.hidden-btn {
    visibility: hidden;
    pointer-events: none;
  }

  .loading-ring {
    width: 80px;
    height: 80px;
    border: 2px solid rgba(201,168,76,0.1);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  .loading-text {
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--text-dim);
    animation: pulse 2s ease-in-out infinite;
  }

  .result-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .result-eyebrow {
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--gold);
    opacity: 0.7;
    margin-bottom: 14px;
  }

  .result-fate-name {
    font-family: 'Ma Shan Zheng', serif;
    font-size: clamp(30px, 8vw, 44px);
    color: var(--gold2);
    text-shadow: 0 0 40px rgba(240,208,128,0.5), 0 0 80px rgba(201,168,76,0.25);
    margin-bottom: 8px;
    line-height: 1.2;
  }

  .result-type-tag {
    display: inline-block;
    background: rgba(155,110,243,0.15);
    border: 1px solid rgba(155,110,243,0.4);
    color: var(--purple2);
    font-size: 11px;
    letter-spacing: 2px;
    padding: 5px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
  }

  .glow-divider {
    margin: 20px 0;
    box-shadow: 0 0 8px rgba(201,168,76,0.4);
  }

  .result-card {
    padding: 24px;
    margin-bottom: 16px;
  }

  .result-card-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold);
    opacity: 0.7;
    margin-bottom: 12px;
  }

  .result-desc {
    font-size: 14px;
    line-height: 2;
    color: var(--text);
    white-space: pre-line;
  }

  .secondary-fate {
    margin-top: 8px;
  }

  .secondary-item {
    margin-bottom: 12px;
  }

  .secondary-header {
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 1px;
    padding: 8px 14px;
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s;
  }

  .secondary-header:hover {
    background: rgba(201,168,76,0.15);
    border-color: rgba(201,168,76,0.4);
  }

  .arrow {
    font-size: 10px;
    transition: transform 0.25s;
  }

  .secondary-item.expanded .arrow {
    transform: rotate(90deg);
  }

  .expand-text {
    opacity: 0.7;
    font-size: 11px;
  }

  .secondary-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text);
    margin-top: 8px;
    padding-left: 14px;
    border-left: 2px solid rgba(201,168,76,0.3);
  }

  .secondary-item.expanded .secondary-content {
    max-height: 500px; /* Adjust based on content */
  }

  .chart-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 340px;
    margin: 0 auto;
    padding: 8px;
  }

  .oracle-box {
    background: linear-gradient(135deg, rgba(155,110,243,0.08), rgba(201,168,76,0.05));
    border: 1px solid rgba(155,110,243,0.25);
    border-radius: 4px;
    padding: 22px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .oracle-box::before,
  .oracle-box::after {
    content: '✦';
    position: absolute;
    opacity: 0.4;
    font-size: 14px;
  }

  .oracle-box::before {
    top: 12px;
    left: 20px;
    color: var(--purple);
  }

  .oracle-box::after {
    bottom: 12px;
    right: 20px;
    color: var(--gold);
  }

  .oracle-text {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 16px;
    line-height: 2;
    color: var(--purple2);
    text-shadow: 0 0 20px rgba(196,160,255,0.3);
    white-space: pre-line;
  }

  .btn-restart {
    display: block;
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 2px;
    padding: 14px;
    margin-top: 24px;
    text-align: center;
  }

  .btn-restart:hover {
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 0 20px rgba(201,168,76,0.1);
  }

  .stars-shimmer {
    animation: shimmer 3s ease-in-out infinite;
  }

  @media (max-width: 640px) {
    #app { padding: 0 14px 70px; }
    #screen-intro { padding-top: 0; }
    #screen-quiz { padding-top: 32px; }
    #screen-result { padding-top: 28px; }
    .question-card { padding: 18px 16px 16px; }
    .result-card, .oracle-box { padding-left: 18px; padding-right: 18px; }
    .question-text { font-size: 14.5px; }
    .quiz-header { gap: 8px; }
    .symbol-ring { width: 110px; height: 110px; margin-bottom: 20px; }
    .symbol-ring::after { font-size: 40px; }
    .intro-desc { font-size: 12.5px; }
    .btn-prev, .btn-next { font-size: 12px; padding: 9px 16px; letter-spacing: 1px; }
    .option-btn { font-size: 13px; padding: 11px 14px; }
  }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<div id="app">
  <div id="screen-intro" class="screen">
    <div class="symbol-ring">
      <div class="dot-ring" id="dot-ring"></div>
    </div>
    <div class="intro-eyebrow">紫微命理 · 缘分推演</div>
    <div class="intro-title">情劫命格</div>
    <div class="intro-sub">· JUST FOR FUN ·</div>
    <div class="intro-divider"></div>
    <div class="intro-desc">
      你与感情的关系，究竟有怎样的命定模式？<br>
      是难以放下的执念，还是轻飘飘游戏人间？<br>
      是本能牵引，还是现实条件的权衡？<br><br>
      通过 15 道情境题，星盘会描摹你在亲密关系里<br>
      最容易触发的情劫模式。
    </div>
    <div class="intro-note">
      小提示：如果一时选不出来，不用纠结"百分百准确"，请尽量选择和你平时状态最接近、最匹配的一项。
    </div>
    <div class="intro-ornaments">✦ &nbsp; ✧ &nbsp; ★ &nbsp; ✧ &nbsp; ✦</div>
    <br>
    <button class="btn-start" onclick="startQuiz()">开启星盘测算</button>
  </div>

  <div id="screen-quiz" class="screen hidden" aria-hidden="true">
    <div class="quiz-header">
      <div class="quiz-counter"><span id="q-current">1</span> / 15</div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div style="font-size:11px;letter-spacing:1px;color:var(--text-dim)">命格</div>
    </div>
    <div class="question-card" id="question-card">
      <div class="question-num" id="question-num">QUESTION 01</div>
      <div class="question-text" id="question-text"></div>
      <div class="options-grid" id="options-grid"></div>
    </div>
    <div class="nav-row">
      <button class="btn-prev hidden-btn" id="btn-prev" onclick="prevQuestion()">← 返回上题</button>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">继续 →</button>
    </div>
  </div>

  <div id="screen-loading" class="screen hidden" aria-hidden="true">
    <div class="loading-ring"></div>
    <div class="loading-text">星盘运算中 · · ·</div>
  </div>

  <div id="screen-result" class="screen hidden" aria-hidden="true">
    <div class="result-header">
      <div class="result-eyebrow">⋆ 你的情劫命格 ⋆</div>
      <div class="result-fate-name" id="result-name">—</div>
      <div class="result-type-tag" id="result-tag">—</div>
    </div>

    <div class="result-card">
      <div class="result-card-title">▸ 命格解析</div>
      <div class="result-desc" id="result-desc">—</div>
    </div>

    <div class="result-card" id="secondary-card" style="display:none">
      <div class="result-card-title">▸ 次要命格</div>
      <div class="secondary-fate" id="secondary-fates"></div>
    </div>

    <div class="result-card">
      <div class="result-card-title">▸ 命格星盘分布</div>
      <div class="chart-container">
        <canvas id="fate-chart"></canvas>
      </div>
    </div>

    <div class="oracle-box">
      <div class="oracle-text" id="oracle-text">—</div>
    </div>

    <button class="btn-restart" onclick="restart()">✦ &nbsp; 重新测算 &nbsp; ✦</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 3500);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.3 + 0.2,
        o: Math.random() * 0.7 + 0.15,
        speed: Math.random() * 0.5 + 0.1,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const t = Date.now() / 1000;
    stars.forEach((s) => {
      const alpha = s.o * (0.6 + 0.4 * Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,245,210,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();

  const dotRing = document.getElementById('dot-ring');
  if (dotRing) {
    for (let i = 0; i < 12; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      const angle = (i / 12) * Math.PI * 2;
      const r = 64;
      dot.style.left = (82 + r * Math.cos(angle)) + 'px';
      dot.style.top = (82 + r * Math.sin(angle)) + 'px';
      dot.style.opacity = i % 3 === 0 ? '1' : '0.35';
      dotRing.appendChild(dot);
    }
  }
})();

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let questions = [];
let current = 0;
// answers[i] = 已选选项的索引，null 表示未答
let answers = [];
let chartInstance = null;

function reveal(id) {
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  el.setAttribute('aria-hidden', 'false');
}

function conceal(id) {
  const el = document.getElementById(id);
  el.classList.add('hidden');
  el.setAttribute('aria-hidden', 'true');
}

// 从 answers 数组重新计算总分（避免累加错误）
function calcScores() {
  const s = { HL: 0, TL: 0, PJ: 0, TT: 0, TY: 0, WQ: 0 };
  answers.forEach((idx, qi) => {
    if (idx === null || idx === undefined) return;
    const opt = questions[qi].opts[idx];
    Object.entries(opt.s).forEach(([k, v]) => {
      s[k] = (s[k] || 0) + v;
    });
  });
  return s;
}

function startQuiz() {
  questions = shuffle(RAW_QUESTIONS).map((q) => ({
    ...q,
    opts: shuffle(q.opts)
  }));
  current = 0;
  answers = new Array(questions.length).fill(null);

  conceal('screen-intro');
  reveal('screen-quiz');
  conceal('screen-loading');
  conceal('screen-result');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('q-current').textContent = current + 1;
  document.getElementById('question-num').textContent = 'QUESTION ' + String(current + 1).padStart(2, '0');
  document.getElementById('question-text').textContent = q.q;

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';

  const labels = ['甲', '乙', '丙', '丁'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    if (answers[current] === i) btn.classList.add('selected');
    btn.innerHTML = `<span class="option-label">${labels[i]}</span><span>${opt.t}</span>`;
    btn.onclick = () => selectOption(i, btn);
    grid.appendChild(btn);
  });

  document.getElementById('progress-fill').style.width = ((current / questions.length) * 100) + '%';

  // 继续按钮：若该题已有答案则显示
  const btnNext = document.getElementById('btn-next');
  if (answers[current] !== null) {
    btnNext.classList.add('visible');
  } else {
    btnNext.classList.remove('visible');
  }

  // 返回按钮：第一题隐藏
  const btnPrev = document.getElementById('btn-prev');
  if (current === 0) {
    btnPrev.classList.add('hidden-btn');
  } else {
    btnPrev.classList.remove('hidden-btn');
  }

  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'card-in 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
}

function selectOption(idx, btn) {
  document.querySelectorAll('.option-btn').forEach((b) => b.classList.remove('selected'));
  btn.classList.add('selected');
  answers[current] = idx;
  document.getElementById('btn-next').classList.add('visible');
}

function nextQuestion() {
  if (answers[current] === null) return;

  current += 1;
  if (current >= questions.length) {
    document.getElementById('progress-fill').style.width = '100%';
    showLoading();
    return;
  }

  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevQuestion() {
  if (current === 0) return;
  current -= 1;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showLoading() {
  conceal('screen-quiz');
  conceal('screen-result');
  reveal('screen-loading');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(showResult, 1800);
}

function showResult() {
  conceal('screen-loading');
  reveal('screen-result');

  const scores = calcScores();
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const [topKey, topScore] = sorted[0];
  const fate = FATES[topKey];

  document.getElementById('result-name').textContent = fate.name;
  document.getElementById('result-tag').textContent = fate.short;
  document.getElementById('result-desc').textContent = FATE_DESC[topKey];
  document.getElementById('oracle-text').textContent = FATE_ORACLE[topKey];

  const secondaryCard = document.getElementById('secondary-card');
  const secondaryFates = document.getElementById('secondary-fates');
  secondaryFates.innerHTML = '';

  // 题目减少后适当降低阈值，保证次要命格有机会显示
  const threshold = topScore * 0.65;
  const secondaries = sorted.slice(1).filter(([, value]) => value >= threshold && value > 0);
  if (secondaries.length > 0) {
    secondaryCard.style.display = 'block';
    secondaries.forEach(([key]) => {
      const container = document.createElement('div');
      container.className = 'secondary-item';

      const header = document.createElement('div');
      header.className = 'secondary-header';
      header.innerHTML = `<span class="arrow">▶</span> <span class="name">${FATES[key].name}</span> <span class="expand-text">点此展开更多</span>`;
      header.onclick = () => toggleSecondary(container);

      const content = document.createElement('div');
      content.className = 'secondary-content';
      content.textContent = FATE_DESC[key];

      container.appendChild(header);
      container.appendChild(content);
      secondaryFates.appendChild(container);
    });
  } else {
    secondaryCard.style.display = 'none';
  }

  renderChart(scores);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderChart(scores) {
  if (chartInstance) chartInstance.destroy();

  const labels = Object.keys(FATES).map((key) => FATES[key].name.replace('情劫型', '').replace('化忌型', ''));
  const data = Object.keys(FATES).map((key) => scores[key] || 0);
  const colors = Object.keys(FATES).map((key) => FATES[key].color);
  const borderColors = colors.map((c) => c.replace('0.8)', '1)'));

  // 动态最大值，避免题目减少后雷达图过小
  const maxVal = Math.max(...data, 6) + 2;

  const ctx = document.getElementById('fate-chart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'radar',
    data: {
      labels,
      datasets: [{
        label: '命格能量',
        data,
        backgroundColor: 'rgba(201,168,76,0.08)',
        borderColor: 'rgba(201,168,76,0.7)',
        pointBackgroundColor: borderColors,
        pointBorderColor: borderColors,
        pointRadius: 5,
        pointHoverRadius: 7,
        borderWidth: 1.5,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(15,15,26,0.95)',
          borderColor: 'rgba(201,168,76,0.3)',
          borderWidth: 1,
          titleColor: '#c9a84c',
          bodyColor: '#e8dfc8',
          callbacks: {
            label: (ctx) => `  ${ctx.raw} 分`
          }
        }
      },
      scales: {
        r: {
          min: 0,
          max: maxVal,
          grid: { color: 'rgba(255,255,255,0.07)' },
          angleLines: { color: 'rgba(201,168,76,0.12)' },
          ticks: {
            display: false,
            stepSize: Math.ceil(maxVal / 4),
          },
          pointLabels: {
            color: 'rgba(232,223,200,0.7)',
            font: { size: 10, family: 'Noto Serif SC' },
          }
        }
      }
    }
  });
}

function toggleSecondary(container) {
  container.classList.toggle('expanded');
}

function restart() {
  conceal('screen-quiz');
  conceal('screen-loading');
  conceal('screen-result');
  reveal('screen-intro');
  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
