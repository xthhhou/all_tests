<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>测一测：你和哪位易学大师共享大脑？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ee;
    --surface:#ffffff;
    --surface-soft:#f1ece0;
    --line: rgba(33,31,28,0.10);
    --cinnabar:#b3402a;
    --cinnabar-deep:#8f3320;
    --cinnabar-tint:#fbf0ec;
    --gold:#a9821f;
    --jade:#3a665b;
    --slate:#52606f;
    --text:#211f1c;
    --text-dim: rgba(33,31,28,0.58);
    --text-muted: rgba(33,31,28,0.36);
    --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:36px 22px 48px;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .eyebrow{
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 10px;
  }

  .screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    flex:1;
    animation:rise 0.5s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .screen{animation:none;}
  }

  .dial-wrap{
    position:relative;
    width:184px;
    height:184px;
    margin:8px auto 28px;
  }
  .dial-wrap svg{display:block; width:100%; height:100%;}
  .dial-track{
    fill:none;
    stroke:var(--line);
    stroke-width:2;
  }
  .dial-fill{
    fill:none;
    stroke:var(--cinnabar);
    stroke-width:2.5;
    stroke-linecap:round;
    transform:rotate(-90deg);
    transform-origin:50% 50%;
    transition:stroke-dashoffset 0.5s ease;
  }
  .dial-glyphs text{
    font-size:10.5px;
    fill:var(--text-muted);
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .dial-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .dial-center .num{
    font-family:var(--serif);
    font-size:30px;
    font-weight:700;
    line-height:1;
  }
  .dial-center .label{
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--text-dim);
    margin-top:4px;
  }

  h1.title{
    font-family:var(--serif);
    font-size:26px;
    font-weight:700;
    line-height:1.45;
    margin:0 0 14px;
  }
  p.sub{
    font-size:14.5px;
    line-height:1.8;
    color:var(--text-dim);
    margin:0 0 32px;
    max-width:340px;
  }
  .persona-strip{
    display:flex;
    gap:8px;
    margin-bottom:36px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .persona-chip{
    font-size:12px;
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:100px;
    color:var(--text-dim);
  }

  .btn-primary{
    font-family:var(--sans);
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    color:#fff8f1;
    background:var(--cinnabar);
    border:none;
    border-radius:100px;
    padding:15px 40px;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .btn-primary:hover{background:var(--cinnabar-deep);}
  .btn-primary:active{transform:scale(0.97);}
  .btn-primary:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .btn-ghost{
    font-family:var(--sans);
    font-size:14px;
    color:var(--text-dim);
    background:transparent;
    border:1px solid var(--line);
    border-radius:100px;
    padding:13px 28px;
    cursor:pointer;
    margin-top:14px;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .btn-ghost:hover{border-color:var(--cinnabar); color:var(--text);}
  .btn-ghost:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .back-btn{
    align-self:flex-start;
    font-family:var(--sans);
    font-size:13px;
    color:var(--text-dim);
    background:none;
    border:none;
    padding:6px 0 14px;
    cursor:pointer;
  }
  .back-btn:hover{color:var(--cinnabar);}
  .back-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .back-btn[hidden]{display:none;}

  .q-card{
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 22px;
    width:100%;
    text-align:left;
    box-shadow:0 8px 24px -16px rgba(33,31,28,0.10);
  }
  .q-num{
    font-family:var(--serif);
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--cinnabar);
    margin:0 0 10px;
  }
  .q-text{
    font-family:var(--serif);
    font-size:19px;
    line-height:1.6;
    font-weight:700;
    margin:0 0 22px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:var(--bg);
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
    font-family:var(--sans);
    font-size:14.5px;
    line-height:1.55;
    color:var(--text);
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
  }
  .opt:last-child{margin-bottom:0;}
  .opt:hover{border-left-color:var(--cinnabar); background:#fff;}
  .opt:active{transform:scale(0.99);}
  .opt:focus-visible{outline:2px solid var(--cinnabar); outline-offset:2px;}
  .opt.chosen{border-left-color:var(--cinnabar); background:var(--cinnabar-tint);}

  .medal{
    width:152px;
    height:152px;
    border-radius:50%;
    border:2px solid var(--ring-color, var(--gold));
    padding:6px;
    margin:4px auto 18px;
    background:var(--surface-soft);
  }
  .medal svg{width:100%; height:100%; display:block;}

  .r-eyebrow{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ring-color, var(--gold));
    margin:0 0 8px;
  }
  h2.r-title{
    font-family:var(--serif);
    font-size:25px;
    font-weight:900;
    margin:0 0 6px;
    line-height:1.4;
  }
  .r-subtitle{
    font-size:13.5px;
    color:var(--text-dim);
    margin:0 0 18px;
    line-height:1.6;
    max-width:360px;
  }

  .tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:22px;
  }
  .tag{
    font-size:12.5px;
    padding:7px 14px;
    border-radius:100px;
    background:var(--surface-soft);
    border:1px solid var(--ring-color, var(--gold));
    color:var(--text);
  }

  .bio-box{
    background:var(--surface-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 20px;
    text-align:left;
    width:100%;
    margin-bottom:22px;
  }
  .bio-box p{
    font-size:13.5px;
    line-height:1.9;
    color:var(--text-dim);
    margin:0;
  }

  .analysis{
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 24px;
    text-align:left;
    width:100%;
    margin-bottom:24px;
  }
  .analysis p{
    font-size:14.5px;
    line-height:1.85;
    margin:0 0 16px;
  }
  .analysis p:last-child{margin-bottom:0;}
  .analysis .section-label{
    font-family:var(--serif);
    font-weight:700;
    color:var(--cinnabar);
    display:block;
    margin-bottom:4px;
  }
  .analysis .tip-label{
    font-family:var(--serif);
    font-weight:700;
    color:var(--cinnabar);
  }

  .divider{
    width:32px;
    height:1px;
    background:var(--line);
    margin:0 auto 16px;
  }
  .actions{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .copy-hint{
    font-size:12px;
    color:var(--text-dim);
    margin-top:10px;
    min-height:16px;
  }

  .disclaimer{
    font-size:12px;
    color:var(--text-muted);
    text-align:center;
    margin-top:32px;
    letter-spacing:0.06em;
  }

  footer.note{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    margin-top:auto;
    padding-top:32px;
  }
</style>
</head>
<body>
<div id="app"></div>

      ring:"var(--jade)",

      bio: "西汉著名的天文学家、易学宗师。\u201c象数派\u201d的巅峰人物。他发明了今天占卜界仍在使用的纳甲法和八宫卦。他深信天人感应，认为世界上没有任何事情是随机的，所有的风吹草动（比如眼皮跳、碎杯子）都是宇宙发来的定向预警信号。",

        "<span class='section-label'>决策风格</span>在工作中，你是那个最不愿意拍脑袋做决定的人。每一个选择，你都希望有数据、有先例、有逻辑支撑。这种风格让你在需要严谨判断的场景里非常耀眼，但偶尔也会因为觉得信息还不够而迟迟无法拍板。你不是优柔寡断，只是对草率这件事有天然的排斥。身边的人可能需要一点耐心，但最后往往会感谢你的审慎。",

        "<span class='section-label'>自我认知与价值观</span>你有一套极其自洽的内心秩序。外界的评价体系——薪水、头衔、别人的眼光——很难真正动摇你。你更在意的是，这件事是不是我心里真正想要的，而不是这件事看起来是不是很厉害。这种清醒在很多人的人生里是稀缺品。但也正因为如此，你有时候会显得不太好驱动——不是你不努力，而是你只愿意为自己认可的事全力以赴。",

    {

        {p:"shaoyong", t:"觉得这是冥冥之中早已注定要让自己注意到的事，但不会因此紧张"},
        {p:"jingfang", t:"默默记下来，回去查一下这个数字代表什么意思，是不是有什么信号"},
        {p:"laizhide", t:"反正怎么躲都躲不开，那干脆就自己解读一种好兆头，只要我自己觉得这是老天在给我发好运信号，这数字就拿我没招"}

    {
      text:"你和好朋友吵了一架，事后你也说不清到底谁对谁错。",
      options:[
        {p:"laizhide", t:"试着站在对方角度把整件事倒过来想一遍，看看自己是不是也理解错了"},
        {p:"lujiuyuan", t:"觉得吵架本身比「谁对谁错」更说明问题——重要的是关系，不是输赢"},

        {p:"jingfang", t:"把吵架过程在脑子里重新推演一遍，分析是哪一步谁先说错了哪句话"}
      ]
    },
    {
      text:"临时被通知，原本计划好的聚会或旅行突然取消了。",
      options:[
        {p:"jingfang", t:"突然取消绝对是一种信号，指不定这趟出门会遇上大暴雨滞留、或者跟同行的人起大冲突"},
        {p:"lujiuyuan", t:"不去了就不去了呗，只要我心情是放假的，在哪儿不是度假"},
        {p:"laizhide", t:"第一反应是「取消了说不定反而是好事」，开始想象会有什么意外收获"},

      options:[

        {p:"laizhide", t:"失败了说明这事已经到头了，那按照\u201c物极必反\u201d的规律，接下来该触底反弹走好运了"},
        {p:"jingfang", t:"回去仔细复盘整个过程，想搞清楚到底哪个环节出了问题，复盘准备下一次的试炼"},
        {p:"lujiuyuan", t:"结果已经这样了，纠结「为什么」没意义，能力和价值又不需要靠这个来证明。真正的成功是我在这个过程中变强了"}
      ]
    },
    {
      text:"你在路上捡到一笔小钱，或是收到一个意外的小红包。",
      options:[
        {p:"lujiuyuan", t:"捡到就捡到了，开心一下就过去，不会特别赋予它什么意义"},
        {p:"jingfang", t:"觉得这是个吉兆，顺手记一下今天的日子，留意接下来会不会有别的好事验证"},
        {p:"shaoyong", t:"觉得这种小幸运本来就该有，不算意外，就当是早就该来的"},
        {p:"laizhide", t:"笑着想「今天运气不错」，但也提醒自己好事坏事经常是连着来的，别太得意"}
      ]
    },
    {
      text:"朋友或家人突然说了一句很尖锐的话，让你不太舒服。",
      options:[
        {p:"laizhide", t:"先把这话反过来想——如果对方是出于关心才这么说的呢？换个角度听"},
        {p:"jingfang", t:"在心里把对方说的每句话拆开分析，想搞清楚哪些是事实哪些是情绪"},
        {p:"lujiuyuan", t:"别人怎么说是别人的事，自己知道自己是什么样就够了，不会太往心里去"},
        {p:"shaoyong", t:"觉得该听到的话迟早会有人说出来，这次轮到这个人说，不算意外"}
      ]
    },
    {
      text:"你站在人生一个重要选择的十字路口（换工作、搬城市），迟迟做不了决定。",
      options:[
        {p:"shaoyong", t:"相信走到这个十字路口本身就是命运安排好的一步，会顺其自然地走下去"},
        {p:"lujiuyuan", t:"觉得选哪个都行，重要的不是选项本身，而是自己到底想要什么样的生活，心要是虚的，在哪都是漂泊"},
        {p:"jingfang", t:"借助外部力量做决定，比如咨询家人朋友，或者求神问佛"},
        {p:"laizhide", t:"列出每个选项具体的利弊和概率，希望靠分析理出一个「最优解」"}
      ]
    },
    {
      text:"你半夜做了一个很奇怪、印象很深的梦。",
      options:[
        {p:"jingfang", t:"早上起来第一件事是回想梦的细节，查一查这个梦在传统说法里代表什么"},
        {p:"shaoyong", t:"觉得有些梦是潜意识替自己提前感应到了什么，但不会因此改变任何计划"},
        {p:"laizhide", t:"想这梦可能反着应验，比如梦到不好的事，说不定现实里反而是好事"},
        {p:"lujiuyuan", t:"梦就是梦，脑子睡觉时随便处理信息而已，醒了就不会再想"}

  var TOTAL = Q.length;
  var TRIGRAMS = ["\u2630","\u2631","\u2632","\u2633","\u2634","\u2635","\u2636","\u2637"];
  var state = { screen:"intro", q:0, answers:{} };
  var app = document.getElementById("app");

  function dialSVG(pct, ctr){
    var r = 86, c = 92;
    var circ = 2*Math.PI*r;
    var off = circ * (1-pct);
    var g = TRIGRAMS.map(function(g,i){
      var a = (i/8)*2*Math.PI - Math.PI/2;
      return '<text x="'+(c+(r+18)*Math.cos(a))+'" y="'+(c+(r+18)*Math.sin(a))+'">'+g+'</text>';
    }).join("");
    return '<div class="dial-wrap"><svg viewBox="0 0 '+(c*2)+' '+(c*2)+'">'+
      '<circle class="dial-track" cx="'+c+'" cy="'+c+'" r="'+r+'"></circle>'+
      '<circle class="dial-fill" cx="'+c+'" cy="'+c+'" r="'+r+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"></circle>'+
      '<g class="dial-glyphs">'+g+'</g></svg><div class="dial-center">'+ctr+'</div></div>';
  }

  function render(){
    if(state.screen==="intro") return rI();
    if(state.screen==="quiz") return rQ();
    return rR();
  }

  function rI(){
    app.innerHTML =
      '<div class="screen">'+
        dialSVG(0, '<div class="num" style="font-size:34px;">\u262f</div>')+
        '<p class="eyebrow">一个关于本能反应的小测试</p>'+
        '<h1 class="title">你和哪位易学大师<br>共享大脑？</h1>'+
        '<p class="sub">十个生活场景答题，没有玄学概念，只问你的第一反应。答完看看你的思维方式更接近哪位大师。</p>'+
        '<div class="persona-strip">'+Object.keys(P).map(function(k){return '<span class="persona-chip">'+P[k].name+'</span>';}).join("")+'</div>'+
        '<button class="btn-primary" id="start-btn">开始测试</button>'+
        '<p class="disclaimer">大众测试，仅供娱乐</p></div>';
    document.getElementById("start-btn").onclick = function(){
      state = { screen:"quiz", q:0, answers:{} }; render();
    };
  }

  function rQ(){
    var q = Q[state.q];
    var pv = (state.q in state.answers) ? state.answers[state.q] : undefined;
    app.innerHTML =
      '<div class="screen">'+
        dialSVG(state.q/TOTAL, '<div class="num">'+(state.q+1)+'</div><div class="label">/ '+TOTAL+'</div>')+
        '<button class="back-btn" id="back-btn" '+(state.q===0?"hidden":"")+'>\u2190 上一题</button>'+
        '<div class="q-card"><p class="q-num">第 '+(state.q+1)+' 题</p><p class="q-text">'+q.text+'</p>'+
          q.options.map(function(o,i){
            return '<button class="opt'+((pv!==undefined && pv===o.p)?" chosen":"")+'" type="button" data-i="'+i+'">'+o.t+'</button>';
          }).join("")+'</div>'+
        '<p class="disclaimer">大众测试，仅供娱乐</p></div>';
    if(state.q>0) document.getElementById("back-btn").onclick = function(){ state.q--; render(); };
    var btns = app.querySelectorAll(".opt");
    btns.forEach(function(b){
      b.onclick = function(){
        if(b.disabled) return;
        btns.forEach(function(x){ x.disabled=true; x.classList.remove("chosen"); });
        b.classList.add("chosen");
        state.answers[state.q] = q.options[parseInt(b.getAttribute("data-i"),10)].p;
        setTimeout(function(){ state.q++; if(state.q>=TOTAL) state.screen="result"; render(); },320);
      };
    });
  }

  function avatarSVG(key){
    if(key==="shaoyong"){
      return '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="var(--surface-soft)"/>'+
        '<path d="M55 150 Q60 185 100 188 Q140 185 145 150 Q150 120 140 110 L60 110 Q50 120 55 150Z" fill="#cfcab3"/>'+
        '<circle cx="100" cy="95" r="46" fill="var(--surface)" stroke="#2a2f3a" stroke-width="3"/>'+
        '<path d="M62 84 Q100 60 138 84" stroke="#2a2f3a" stroke-width="3" fill="none"/>'+
        '<path d="M76 96 Q84 102 92 96" stroke="#2a2f3a" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<path d="M108 96 Q116 102 124 96" stroke="#2a2f3a" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<path d="M88 113 Q100 119 112 113" stroke="#2a2f3a" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<path d="M64 128 Q70 168 100 178 Q98 150 90 132Z" fill="#d8d2bb"/>'+
        '<path d="M150 118 L182 96 L178 130 L162 142Z" fill="var(--gold)" opacity="0.9"/>'+
        '<path d="M150 118 L178 130" stroke="#8a7016" stroke-width="1.5"/>'+
        '<circle cx="44" cy="50" r="2.6" fill="var(--gold)"/><circle cx="158" cy="38" r="2" fill="var(--gold)"/><circle cx="170" cy="64" r="1.6" fill="var(--gold)"/></svg>';
    }
    if(key==="jingfang"){
      return '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="var(--surface-soft)"/>'+
        '<path d="M58 96 Q56 50 100 48 Q144 50 142 96 L142 110 L58 110Z" fill="#23282f"/>'+
        '<circle cx="100" cy="100" r="46" fill="var(--surface)" stroke="#23282f" stroke-width="3"/>'+
        '<circle cx="82" cy="100" r="13" fill="none" stroke="var(--jade)" stroke-width="3"/>'+
        '<circle cx="118" cy="100" r="13" fill="none" stroke="var(--jade)" stroke-width="3"/>'+
        '<line x1="95" y1="100" x2="105" y2="100" stroke="var(--jade)" stroke-width="3"/>'+
        '<path d="M93 122 Q100 126 107 122" stroke="#23282f" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<circle cx="148" cy="146" r="22" fill="var(--surface)" stroke="var(--jade)" stroke-width="3"/>'+
        '<line x1="148" y1="128" x2="148" y2="164" stroke="var(--jade)" stroke-width="1.5"/>'+
        '<line x1="130" y1="146" x2="166" y2="146" stroke="var(--jade)" stroke-width="1.5"/>'+

        '<line x1="160" y1="134" x2="136" y2="158" stroke="var(--jade)" stroke-width="1"/></svg>';
    }
    if(key==="lujiuyuan"){
      return '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="var(--surface-soft)"/>'+
        '<path d="M56 92 Q60 50 100 48 Q140 50 144 92Z" fill="#b85c2c"/>'+
        '<circle cx="100" cy="100" r="46" fill="var(--surface)" stroke="#b85c2c" stroke-width="3"/>'+
        '<path d="M82 88 Q100 72 118 88" stroke="#b85c2c" stroke-width="2.5" fill="none"/>'+
        '<path d="M84 98 Q92 104 100 98" stroke="#b85c2c" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<path d="M100 98 Q108 104 116 98" stroke="#b85c2c" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<path d="M88 118 Q100 124 112 118" stroke="#b85c2c" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<path d="M54 118 Q48 100 60 92" stroke="#b85c2c" stroke-width="5" fill="none" stroke-linecap="round"/>'+
        '<path d="M148 118 Q154 100 142 92" stroke="#b85c2c" stroke-width="5" fill="none" stroke-linecap="round"/>'+
        '<path d="M165 50 Q158 42 164 36" stroke="var(--slate)" stroke-width="1.5" fill="none"/>'+
        '<path d="M170 56 Q163 48 169 42" stroke="var(--slate)" stroke-width="1.5" fill="none"/>'+
        '<circle cx="146" cy="56" r="2" fill="var(--slate)"/><circle cx="158" cy="46" r="1.5" fill="var(--slate)"/></svg>';
    }
    return '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="var(--surface-soft)"/>'+
      '<path d="M56 92 Q60 50 100 48 Q140 50 144 92Z" fill="#23282f"/>'+
      '<circle cx="100" cy="100" r="46" fill="var(--surface)" stroke="#23282f" stroke-width="3"/>'+
      '<path d="M84 98 Q88 102 92 98" stroke="#23282f" stroke-width="3" fill="none" stroke-linecap="round"/>'+
      '<path d="M108 98 Q112 102 116 98" stroke="#23282f" stroke-width="3" fill="none" stroke-linecap="round"/>'+
      '<path d="M88 118 Q100 124 112 118" stroke="#23282f" stroke-width="3" fill="none" stroke-linecap="round"/>'+
      '<g transform="translate(100 44)"><circle r="22" fill="var(--surface)" stroke="#23282f" stroke-width="2.5"/>'+
      '<path d="M0 -22 A11 11 0 0 1 0 0 A11 11 0 0 0 0 22 A22 22 0 0 1 0 -22Z" fill="var(--cinnabar)"/>'+
      '<circle cx="0" cy="-11" r="4" fill="var(--surface)"/><circle cx="0" cy="11" r="4" fill="var(--cinnabar)"/></g></svg>';
  }

  function computeWinner(){
    var sc = {shaoyong:0,jingfang:0,lujiuyuan:0,laizhide:0};
    Object.values(state.answers).forEach(function(p){ if(p) sc[p]++; });
    var maxCount = -1;
    Object.keys(sc).forEach(function(k){ if(sc[k] > maxCount) maxCount = sc[k]; });
    var tied = [];
    Object.keys(sc).forEach(function(k){ if(sc[k] === maxCount) tied.push(k); });
    if(tied.length === 1) return tied[0];
    return tied[Math.floor(Math.random() * tied.length)];
  }

  function rR(){
    var p = P[computeWinner()];
    var ph = p.paragraphs.map(function(x){ return '<p>'+x+'</p>'; }).join("");

    app.innerHTML =
      '<div class="screen" style="--ring-color:'+p.ring+'">'+
        '<div class="medal">'+avatarSVG(p.key)+'</div>'+
        '<p class="r-eyebrow">'+p.eyebrow+'</p>'+
        '<h2 class="r-title">'+p.name+'</h2>'+
        '<p class="r-subtitle">'+p.title+'</p>'+
        '<div class="tags">'+p.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join("")+'</div>'+
        '<div class="bio-box"><p>'+p.bio+'</p></div>'+
        '<div class="analysis">'+ph+'</div>'+
        '<div class="actions"><button class="btn-ghost" id="restart-btn">再测一次</button></div>'+
        '<p class="disclaimer">大众测试，仅供娱乐</p></div>';

    document.getElementById("restart-btn").onclick = function(){ state = { screen:"intro", q:0, answers:{} }; render(); window.scrollTo(0,0); };
  }

  render();
})();
</script>
